[package]
name = "tinyzkp"
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Rust client for TinyZKP proof receipts"
keywords = ["zk", "stark", "zero-knowledge", "proof", "api"]
categories = ["cryptography", "api-bindings"]
homepage = "https://tinyzkp.com?source=crates_tinyzkp&medium=package_registry&platform=crates_io&intent=learn"
documentation = "https://tinyzkp.com/docs?source=crates_tinyzkp&medium=package_registry&platform=crates_io&intent=docs"
repository = "https://github.com/logannye/hc-stark"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["time"] }
