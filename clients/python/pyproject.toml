[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyzkp"
version = "0.1.1"
description = "Python client for TinyZKP proof receipts — generate, poll, and verify STARK state transitions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["zk", "stark", "zero-knowledge", "proof", "cryptography", "receipt", "verification", "ai-agent", "audit-log"]
authors = [{ name = "TinyZKP", email = "support@tinyzkp.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.20"]
test = ["pytest>=7", "pytest-asyncio>=0.23", "respx>=0.20"]

[project.urls]
Homepage = "https://tinyzkp.com?source=pypi_tinyzkp&medium=package_registry&platform=pypi&intent=learn"
Documentation = "https://tinyzkp.com/docs?source=pypi_tinyzkp&medium=package_registry&platform=pypi&intent=docs"
"Get API Key" = "https://tinyzkp.com/signup?source=pypi_tinyzkp&medium=package_registry&platform=pypi&intent=api_key"
"Verify Receipt" = "https://tinyzkp.com/verify?source=pypi_tinyzkp&medium=package_registry&platform=pypi&intent=verify_receipt"
"Pricing and Limits" = "https://tinyzkp.com/limits?source=pypi_tinyzkp&medium=package_registry&platform=pypi&intent=limits"
Repository = "https://github.com/logannye/hc-stark"
Issues = "https://github.com/logannye/hc-stark/issues"

[tool.hatch.build.targets.wheel]
packages = ["tinyzkp"]
