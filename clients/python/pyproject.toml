[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tinyzkp"
version = "0.2.0.dev0"
description = "Local artifact SDK for TinyZKP's resource-bounded Plonky3 backend"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["zk", "stark", "plonky3", "proof", "artifact", "verification"]
authors = [{ name = "TinyZKP", email = "support@tinyzkp.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = ["blake3==1.0.9"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
test = ["pytest==8.4.2"]

[project.urls]
Homepage = "https://tinyzkp.com?source=pypi_tinyzkp&medium=package_registry&platform=pypi&intent=learn"
Documentation = "https://tinyzkp.com/docs?source=pypi_tinyzkp&medium=package_registry&platform=pypi&intent=docs"
Security = "https://tinyzkp.com/security"
Repository = "https://github.com/logannye/hc-stark"
Issues = "https://github.com/logannye/hc-stark/issues"

[tool.hatch.build.targets.wheel]
packages = ["tinyzkp"]
