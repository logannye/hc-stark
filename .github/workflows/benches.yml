name: Owner engine resource qualification

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact lowercase main commit to qualify"
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: owner-engine-resource-${{ inputs.expected_main_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require owner dispatch of the exact current main commit
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$OWNER" = logannye
          test "$ACTOR" = "$OWNER"
          test "$TRIGGERING_ACTOR" = "$OWNER"
          test "$REF" = refs/heads/main
          test "${#EXPECTED_MAIN_SHA}" = 40
          case "$EXPECTED_MAIN_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          test "$RELEASE_SHA" = "$EXPECTED_MAIN_SHA"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Require the dispatch commit to remain current main
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

  backend-release-matrix:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HC_RELEASE_SHA: ${{ inputs.expected_main_sha }}
      HC_RELEASE_REF: main
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Install locked benchmark validator dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/benchmark-venv"
          "$RUNNER_TEMP/benchmark-venv/bin/python" -m pip install \
            -r scripts/benchmark/requirements.txt
      - name: Build one release-identity-bound CLI
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tinyzkp-cargo-target
        run: cargo build --release -p hc-cli --bin hc-cli --locked
      - name: Preserve only the qualified CLI and reclaim build storage
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tinyzkp-cargo-target
        run: |
          install -m 0755 \
            "$CARGO_TARGET_DIR/release/hc-cli" \
            "$RUNNER_TEMP/tinyzkp-engine"
          cargo clean --target-dir "$CARGO_TARGET_DIR"
          test -x "$RUNNER_TEMP/tinyzkp-engine"
      - name: Prepare ephemeral owner-only scratch and cgroup delegation
        run: |
          for workload in fibonacci-1m poseidon2-1m fibonacci-16m; do
            sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" \
              "/var/lib/tinyzkp-bench/scratch/$workload"
          done
          sudo install -d -m 0755 /sys/fs/cgroup/tinyzkp-bench
          install -d -m 0700 raw-reports/fixed-host-release-matrix
      - name: Run the complete scoped production matrix
        run: |
          report_owner="$(id -u):$(id -g)"
          reclaim_reports() {
            sudo chown -R "$report_owner" raw-reports/fixed-host-release-matrix || true
          }
          trap reclaim_reports EXIT
          sudo --preserve-env=HC_RELEASE_SHA,HC_RELEASE_REF \
            "$RUNNER_TEMP/benchmark-venv/bin/python" \
            scripts/benchmark/run_fixed_host_release_matrix.py \
              --release-sha "$HC_RELEASE_SHA" \
              --hc-cli "$RUNNER_TEMP/tinyzkp-engine" \
              --output-dir raw-reports/fixed-host-release-matrix
      - name: Bind the exact qualification artifact inventory
        working-directory: raw-reports/fixed-host-release-matrix
        run: |
          checksum_tmp="$RUNNER_TEMP/qualification-SHA256SUMS"
          find . -maxdepth 1 -type f ! -name qualification-SHA256SUMS -print0 |
            sort -z | xargs -0 sha256sum >"$checksum_tmp"
          test -s "$checksum_tmp"
          mv "$checksum_tmp" qualification-SHA256SUMS
      - name: Attest the exact-main qualification inventory
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: raw-reports/fixed-host-release-matrix/qualification-SHA256SUMS
      - name: Upload source- and CLI-bound qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plonky3-backend-release-matrix-${{ inputs.expected_main_sha }}
          path: raw-reports/fixed-host-release-matrix/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
