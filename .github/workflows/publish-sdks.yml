name: Publish SDKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-sdks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.backend-identity.outputs.release_sha }}
    steps:
      - name: Require a published backend release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          BACKEND_TAG: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          test -n "$BACKEND_TAG"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
          path: backend-gate
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Download final evidence from the published backend release
        working-directory: backend-gate
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_TAG: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
        run: |
          test "$(gh release view "$BACKEND_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$BACKEND_TAG" --json isPrerelease --jq .isPrerelease)" = false
          install -d release-artifacts
          gh release download "$BACKEND_TAG" \
            --dir release-artifacts \
            --pattern hc-cli-linux-x86_64 \
            --pattern hc-server-linux-x86_64 \
            --pattern hc-mcp-http-linux-x86_64 \
            --pattern hc-mcp-stdio-linux-x86_64 \
            --pattern tinyzkp-maintenance.oci.tar \
            --pattern tinyzkp-backend.spdx.json \
            --pattern backend-v1-gates.json \
            --pattern cli-release.json \
            --pattern backend-v1-final-evidence.json \
            --pattern backend-v1-final-gates.json \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern plonky3-compatibility-v1.json
      - name: Verify signed backend release and full evidence gate
        id: backend-identity
        working-directory: backend-gate
        env:
          BACKEND_TAG: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install -r scripts/benchmark/requirements.txt
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/logannye/hc-stark/\.github/workflows/release-backend\.yml@refs/tags/backend-v[^/]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-artifacts/SHA256SUMS
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          evidenced_sha="$(jq -er '.release_sha | select(test("^[0-9a-f]{40}$"))' \
            release-artifacts/backend-v1-final-evidence.json)"
          test "$(git rev-parse HEAD)" = "$evidenced_sha"
          test "$(git rev-list -n 1 "$BACKEND_TAG")" = "$evidenced_sha"
          gh attestation verify release-artifacts/backend-v1-final-evidence.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release-backend.yml" \
            --source-digest "$evidenced_sha" \
            --source-ref "refs/tags/$BACKEND_TAG" \
            --deny-self-hosted-runners
          gh attestation verify release-artifacts/backend-v1-final-gates.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/release-backend.yml" \
            --source-digest "$evidenced_sha" \
            --source-ref "refs/tags/$BACKEND_TAG" \
            --deny-self-hosted-runners
          echo "release_sha=$evidenced_sha" >> "$GITHUB_OUTPUT"
          cmp release/plonky3-compatibility-v1.json \
            release-artifacts/plonky3-compatibility-v1.json
          python3 scripts/ci/backend_release_ready.py \
            --config release-artifacts/backend-v1-final-gates.json
      - name: Require SDK tag, schemas, dependencies, and contracts to match
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/verify_sdk_release_versions.py --tag "$SDK_TAG"
          python3 scripts/release/verify_sdk_backend_compatibility.py \
            --backend-root backend-gate
          python3 -m pip install -e 'clients/python[test]'
          python3 -m pytest clients/python/tests -q
          npm --prefix clients/typescript ci
          npm --prefix clients/typescript test
          cargo test --manifest-path clients/rust/Cargo.toml --locked
      - name: Require audited backend crates to be available
        run: |
          stream_version="$(cargo metadata --manifest-path backend-gate/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "hc-stream"))')"
          plonky3_version="$(cargo metadata --manifest-path backend-gate/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "hc-plonky3"))')"
          python3 backend-gate/scripts/release/wait_for_crate_version.py \
            hc-stream "$stream_version" --timeout-seconds 60
          python3 backend-gate/scripts/release/wait_for_crate_version.py \
            hc-plonky3 "$plonky3_version" --timeout-seconds 60
      - name: Build every registry artifact before permitting uploads
        run: |
          python3 -m pip install build twine
          python3 -m build clients/python
          (cd clients/typescript && npm pack --dry-run)
          cargo package --manifest-path clients/rust/Cargo.toml --locked

  publish-python:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and publish
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Attest Python distributions
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: clients/python/dist/*
      - name: Upload Python distributions
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*

  publish-typescript:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build and publish
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
          npm test
          npm publish --provenance --access public

  publish-rust:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - name: Package
        working-directory: clients/rust
        run: cargo package --locked
      - name: Attest Rust crate package
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: clients/rust/target/package/*.crate
      - name: Publish
        working-directory: clients/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

  publish-wasm:
    needs: release-gate
    name: Publish WASM verifier to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.backend_sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build WASM package
        working-directory: crates/hc-wasm
        env:
          TINYZKP_SDK_VERSION: ${{ github.ref_name }}
        run: ./build.sh
      - name: Test WASM package
        working-directory: crates/hc-wasm
        run: |
          node test-package.mjs
          cd pkg
          npm pack --dry-run
      - name: Attest WASM package files
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: crates/hc-wasm/pkg/**
      - name: Publish to npm
        working-directory: crates/hc-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  build-mcp-binaries:
    needs: release-gate
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: hc-mcp-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: hc-mcp-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: hc-mcp-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-gate.outputs.backend_sha }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Build MCP binaries
        run: cargo build --release --target ${{ matrix.target }} -p hc-mcp
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/hc-mcp-stdio ${{ matrix.name }}-stdio
          cp target/${{ matrix.target }}/release/hc-mcp-http ${{ matrix.name }}-http
          chmod +x ${{ matrix.name }}-stdio ${{ matrix.name }}-http
          shasum -a 256 -b ${{ matrix.name }}-stdio ${{ matrix.name }}-http > ${{ matrix.name }}.sha256
      - name: Attest MCP binaries
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-checksums: ${{ matrix.name }}.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ matrix.name }}-stdio
            ${{ matrix.name }}-http
            ${{ matrix.name }}.sha256
