name: Publish SDKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a published backend release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          BACKEND_TAG: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          test -n "$BACKEND_TAG"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
          path: backend-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download final evidence from the published backend release
        working-directory: backend-gate
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_TAG: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
        run: |
          test "$(gh release view "$BACKEND_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$BACKEND_TAG" --json isPrerelease --jq .isPrerelease)" = false
          install -d release-artifacts
          gh release download "$BACKEND_TAG" \
            --dir release-artifacts \
            --pattern backend-v1-final-evidence.json \
            --pattern backend-v1-final-gates.json \
            --pattern SHA256SUMS \
            --pattern SHA256SUMS.sigstore.json \
            --pattern plonky3-compatibility-v1.json
      - name: Verify signed backend release and full evidence gate
        working-directory: backend-gate
        run: |
          python3 -m pip install -r scripts/benchmark/requirements.txt
          cosign verify-blob \
            --bundle release-artifacts/SHA256SUMS.sigstore.json \
            release-artifacts/SHA256SUMS
          (cd release-artifacts && sha256sum --check --ignore-missing SHA256SUMS)
          cmp release/plonky3-compatibility-v1.json \
            release-artifacts/plonky3-compatibility-v1.json
          python3 scripts/ci/backend_release_ready.py \
            --config release-artifacts/backend-v1-final-gates.json
      - name: Require SDK tag, schemas, dependencies, and contracts to match
        env:
          SDK_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/verify_sdk_release_versions.py --tag "$SDK_TAG"
          python3 scripts/release/verify_sdk_backend_compatibility.py \
            --backend-root backend-gate
          python3 -m pip install -e 'clients/python[test]'
          python3 -m pytest clients/python/tests -q
          npm --prefix clients/typescript ci
          npm --prefix clients/typescript test
          cargo test --manifest-path clients/rust/Cargo.toml --locked
      - name: Require audited backend crates to be available
        run: |
          stream_version="$(cargo metadata --manifest-path backend-gate/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "hc-stream"))')"
          plonky3_version="$(cargo metadata --manifest-path backend-gate/Cargo.toml --no-deps --format-version 1 | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "hc-plonky3"))')"
          python3 backend-gate/scripts/release/wait_for_crate_version.py \
            hc-stream "$stream_version" --timeout-seconds 60
          python3 backend-gate/scripts/release/wait_for_crate_version.py \
            hc-plonky3 "$plonky3_version" --timeout-seconds 60
      - name: Build every registry artifact before permitting uploads
        run: |
          python3 -m pip install build twine
          python3 -m build clients/python
          (cd clients/typescript && npm pack --dry-run)
          cargo package --manifest-path clients/rust/Cargo.toml --locked

  publish-python:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Attest Python distributions
        uses: actions/attest@v4
        with:
          subject-path: clients/python/dist/*
      - name: Upload Python distributions
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*

  publish-typescript:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build and publish
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
          npm test
          npm publish --provenance --access public

  publish-rust:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Package
        working-directory: clients/rust
        run: cargo package --locked
      - name: Attest Rust crate package
        uses: actions/attest@v4
        with:
          subject-path: clients/rust/target/package/*.crate
      - name: Publish
        working-directory: clients/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

  publish-wasm:
    needs: release-gate
    name: Publish WASM verifier to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build WASM package
        working-directory: crates/hc-wasm
        env:
          TINYZKP_SDK_VERSION: ${{ github.ref_name }}
        run: ./build.sh
      - name: Test WASM package
        working-directory: crates/hc-wasm
        run: |
          node test-package.mjs
          cd pkg
          npm pack --dry-run
      - name: Attest WASM package files
        uses: actions/attest@v4
        with:
          subject-path: crates/hc-wasm/pkg/**
      - name: Publish to npm
        working-directory: crates/hc-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  build-mcp-binaries:
    needs: release-gate
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: hc-mcp-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: hc-mcp-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: hc-mcp-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ vars.TINYZKP_BACKEND_RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Build MCP binaries
        run: cargo build --release --target ${{ matrix.target }} -p hc-mcp
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/hc-mcp-stdio ${{ matrix.name }}-stdio
          cp target/${{ matrix.target }}/release/hc-mcp-http ${{ matrix.name }}-http
          chmod +x ${{ matrix.name }}-stdio ${{ matrix.name }}-http
          shasum -a 256 -b ${{ matrix.name }}-stdio ${{ matrix.name }}-http > ${{ matrix.name }}.sha256
      - name: Attest MCP binaries
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ matrix.name }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}-stdio
            ${{ matrix.name }}-http
            ${{ matrix.name }}.sha256
