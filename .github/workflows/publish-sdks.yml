name: Publish SDKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all backend-v1 release evidence
        run: python3 scripts/ci/backend_release_ready.py

  publish-python:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and publish
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Attest Python distributions
        uses: actions/attest@v4
        with:
          subject-path: clients/python/dist/*
      - name: Upload Python distributions
        working-directory: clients/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*

  publish-typescript:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build and publish
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
          npm test
          npm publish --provenance --access public

  publish-rust:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - name: Package
        working-directory: clients/rust
        run: cargo package
      - name: Attest Rust crate package
        uses: actions/attest@v4
        with:
          subject-path: clients/rust/target/package/*.crate
      - name: Publish
        working-directory: clients/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish

  publish-wasm:
    needs: release-gate
    name: Publish WASM verifier to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build WASM package
        working-directory: crates/hc-wasm
        run: ./build.sh
      - name: Test WASM package
        working-directory: crates/hc-wasm/pkg
        run: npm pack --dry-run
      - name: Attest WASM package files
        uses: actions/attest@v4
        with:
          subject-path: crates/hc-wasm/pkg/**
      - name: Publish to npm
        working-directory: crates/hc-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  build-mcp-binaries:
    needs: release-gate
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: hc-mcp-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: hc-mcp-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: hc-mcp-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Build MCP binaries
        run: cargo build --release --target ${{ matrix.target }} -p hc-mcp
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/hc-mcp-stdio ${{ matrix.name }}-stdio
          cp target/${{ matrix.target }}/release/hc-mcp-http ${{ matrix.name }}-http
          chmod +x ${{ matrix.name }}-stdio ${{ matrix.name }}-http
          shasum -a 256 -b ${{ matrix.name }}-stdio ${{ matrix.name }}-http > ${{ matrix.name }}.sha256
      - name: Attest MCP binaries
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ matrix.name }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}-stdio
            ${{ matrix.name }}-http
            ${{ matrix.name }}.sha256
