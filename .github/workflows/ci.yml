name: TinyZKP engine and static site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install evidence test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          python3 -m pip install pytest -r scripts/benchmark/requirements.txt

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Locked standalone fuzz workspace
        run: cargo +1.95.0 fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Public engine unit tests
        run: |
          cargo test --locked -p hc-stream -p hc-plonky3 -p hc-cli -p hc-wasm
          cargo test --locked --manifest-path examples/partner-adapter/Cargo.toml

      - name: Public engine clippy
        run: >-
          cargo clippy --locked
          -p hc-stream -p hc-plonky3 -p hc-cli -p hc-wasm
          -p tinyzkp-partner-adapter-example
          --all-targets -- -D warnings

      - name: Frozen compatibility and verifier vectors
        run: |
          python3 scripts/ci/backend_source_scan.py
          python3 scripts/ci/plonky3_compatibility_gate.py
          bash scripts/ci/check_plonky3_known_answers.sh
          cargo check --locked -p hc-wasm --target wasm32-unknown-unknown

      - name: Resource harness tests
        run: |
          python3 -m pytest \
            scripts/benchmark/test_fixed_host_preflight.py \
            scripts/benchmark/test_run_fixed_host_release_matrix.py \
            scripts/benchmark/test_run_plonky3_cgroup.py \
            scripts/benchmark/test_validate_release_gate.py -q

      - name: Materialize the reviewed Git executable for evidence tests
        run: |
          python3 scripts/ci/materialize_anchored_git.py \
            --output "$RUNNER_TEMP/tinyzkp-anchored-git" \
            --github-env "$GITHUB_ENV"

      - name: Require a signed owner assembly whenever candidate evidence exists
        run: |
          if jq -e '.status == "candidate"' release/backend-v1-gates.json >/dev/null
          then
            python3 scripts/ci/backend_prerelease_ready.py \
              --config release/backend-v1-gates.json
          fi

      - name: Release evidence and launch-gate tests
        run: |
          python3 -m pytest \
            scripts/ci/test_guard_launch_gate.py \
            scripts/ci/test_guard_release_index.py \
            scripts/ci/test_claim_containment_scan.py \
            scripts/ci/test_guard_github_action.py \
            scripts/ci/test_founding_validation_status.py \
            scripts/ci/test_profile_expansion_demand_gate.py \
            scripts/ci/test_backend_release_ready.py \
            scripts/ci/test_backend_prerelease_ready.py \
            scripts/ci/test_verify_guard_candidate.py \
            scripts/ci/test_owner_launch_evidence_workflow.py \
            scripts/ci/test_launch_gate_audit.py \
            scripts/ci/test_release_distribution_contract.py \
            scripts/ci/test_materialize_anchored_git.py \
            scripts/ci/test_source_tree_identity.py \
            scripts/ci/test_strict_json.py \
            scripts/ci/test_check_pinned_actions.py \
            scripts/release/test_build_candidate_evidence.py \
            scripts/release/test_build_backend_assembly_provenance.py \
            scripts/release/test_verify_backend_assembly.py \
            scripts/release/test_build_engine_identity_report.py \
            scripts/release/test_finalize_signed_evidence.py \
            scripts/release/test_build_review_bundle.py \
            scripts/release/test_build_external_records.py \
            scripts/release/test_external_signature_gate.py \
            scripts/release/test_run_evidenced_command.py \
            scripts/release/test_run_crash_matrix.py \
            scripts/release/test_run_fuzz_smoke.py -q
          python3 -m pytest \
            scripts/release/test_build_guard_owner_evidence.py \
            scripts/release/test_build_guard_market_evidence.py \
            scripts/ci/test_containment_health_audit.py \
            scripts/monitoring/test_guard_health_audit.py \
            scripts/deploy/test_static_site_canary.py \
            scripts/deploy/test_cloudflare_pages_release.py -q
          npm --prefix deploy/uptime-probe test
          # These repository-derived digests validate source consistency only;
          # protected production trust roots are evaluated in deploy-site.yml.
          python3 scripts/ci/guard_launch_gate.py \
            --check \
            --trusted-policy-sha256 \
              "$(sha256sum release/guard-launch-trust-v1.json | cut -d' ' -f1)" \
            --trusted-signing-policy-sha256 \
              "$(sha256sum release/guard-signing-trust-v1.json | cut -d' ' -f1)"
          python3 scripts/ci/guard_market_clock.py \
            --check \
            --trusted-policy-sha256 \
              "$(sha256sum release/guard-market-trust-v1.json | cut -d' ' -f1)"
          python3 scripts/ci/profile_expansion_demand_gate.py
          python3 scripts/ci/claim_containment_scan.py
          if test -f site/guard-release-index-v1.json; then
            cosign verify-blob \
              --key release/guard-signing-public-key.pem \
              --signature site/guard-release-index-v1.json.sig \
              site/guard-release-index-v1.json
          fi
          python3 scripts/ci/check_pinned_actions.py

      - name: Static site contracts
        run: |
          python3 scripts/commercial/render_offers.py --check
          python3 scripts/ci/site_route_check.py
          python3 scripts/ci/site_deploy_check.py
          python3 -m pytest \
            scripts/ci/test_site_route_check.py \
            scripts/ci/test_guard_site_contract.py \
            scripts/commercial/test_render_offers.py \
            scripts/ci/test_site_asset_manifest.py \
            scripts/ci/test_demand_report.py -q
          node --check site/_worker.js
          node scripts/ci/site_worker_dispatch_test.mjs
          node scripts/ci/site_shared_checkout_test.mjs
          node --test scripts/ci/test_worker_estimate.mjs
          node scripts/ci/estimate_wasm_cli_parity_gate.mjs

      - name: Guard and static-site production preflight
        run: |
          python3 -m pytest scripts/ci/test_guard_pages_launch_preflight.py -q
          # Repository-derived digests make source validation deterministic but
          # never cross the protected production boundary as launch authority.
          python3 scripts/ci/guard_pages_launch_preflight.py \
            --source-guard-trust-sha256 \
              "$(sha256sum release/guard-launch-trust-v1.json | cut -d' ' -f1)" \
            --source-signing-trust-sha256 \
              "$(sha256sum release/guard-signing-trust-v1.json | cut -d' ' -f1)" \
            --source-market-trust-sha256 \
              "$(sha256sum release/guard-market-trust-v1.json | cut -d' ' -f1)"

      - name: Customer-operated OCI image
        run: docker build --build-arg HC_RELEASE_SHA=${{ github.sha }} --build-arg HC_RELEASE_REF=ci -t tinyzkp-engine:ci .

      - name: Static release CLI in pinned customer-operated OCI runtime
        run: |
          cargo build --locked --release -p hc-cli --bin hc-cli \
            --target x86_64-unknown-linux-musl
          engine=target/x86_64-unknown-linux-musl/release/hc-cli
          if readelf --program-headers "$engine" | grep -Fq 'Requesting program interpreter'; then
            exit 1
          fi
          if readelf --dynamic "$engine" 2>/dev/null | grep -Fq '(NEEDED)'; then
            exit 1
          fi
          "$engine" release > "$RUNNER_TEMP/engine-host-release.json"
          install -d "$RUNNER_TEMP/engine-release-context"
          install -m 0755 \
            "$engine" \
            "$RUNNER_TEMP/engine-release-context/tinyzkp-engine-linux-x86_64"
          cp Dockerfile.release-runtime "$RUNNER_TEMP/engine-release-context/Dockerfile"
          docker build \
            --platform linux/amd64 \
            --build-arg HC_RELEASE_SHA=${{ github.sha }} \
            --build-arg HC_RELEASE_REF=ci \
            --build-arg HC_RELEASE_BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            -t tinyzkp-engine-release:ci \
            "$RUNNER_TEMP/engine-release-context"
          docker run --rm \
            --network none \
            --read-only \
            --user 10001:10001 \
            --tmpfs /work:rw,nosuid,nodev,noexec,size=16777216,uid=10001,gid=10001,mode=0700 \
            --tmpfs /scratch:rw,nosuid,nodev,noexec,size=16777216,uid=10001,gid=10001,mode=0700 \
            tinyzkp-engine-release:ci release \
            > "$RUNNER_TEMP/engine-oci-release.json"
          cmp "$RUNNER_TEMP/engine-host-release.json" "$RUNNER_TEMP/engine-oci-release.json"

      - name: Dependency policy
        run: |
          cargo install cargo-audit --locked
          cargo audit --json > "$RUNNER_TEMP/tinyzkp-cargo-audit.json" || true
          python3 -m pytest scripts/ci/test_cargo_audit_policy.py -q
          python3 scripts/ci/cargo_audit_policy.py --report "$RUNNER_TEMP/tinyzkp-cargo-audit.json"
