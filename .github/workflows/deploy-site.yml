name: Validate and deploy TinyZKP static Pages

on:
  pull_request:
    branches: [main]
    paths:
      - ".gitattributes"
      - "BUSINESS_GUIDE.md"
      - "README.md"
      - "commercial/**"
      - "docs/**"
      - "marketing/**"
      - "migrations/**"
      - "release/**"
      - "site/**"
      - "scripts/ci/**"
      - "scripts/commercial/**"
      - "scripts/deploy/**"
      - "scripts/marketing/**"
      - "toolchains/cloudflare/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-site.yml"
  push:
    branches: [main]
    paths:
      - ".gitattributes"
      - "BUSINESS_GUIDE.md"
      - "README.md"
      - "commercial/**"
      - "docs/**"
      - "marketing/**"
      - "migrations/**"
      - "release/**"
      - "site/**"
      - "scripts/ci/**"
      - "scripts/commercial/**"
      - "scripts/deploy/**"
      - "scripts/marketing/**"
      - "toolchains/cloudflare/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tinyzkp-pages-${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.number) || 'production' }}
  cancel-in-progress: false

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - name: Anchor the installed Cosign executable
        run: |
          cosign_executable="$(command -v cosign)"
          test -x "$cosign_executable"
          echo "TINYZKP_COSIGN=$cosign_executable" >> "$GITHUB_ENV"
      - name: Validate source consistency and static-only routing
        run: |
          python3 -m pip install pytest
          # These local digests make preview/source checks deterministic but
          # confer no launch authority. Production repeats the checks with
          # independently protected environment values.
          python3 scripts/ci/guard_launch_gate.py \
            --check \
            --trusted-policy-sha256 \
              "$(sha256sum release/guard-launch-trust-v1.json | cut -d' ' -f1)" \
            --trusted-signing-policy-sha256 \
              "$(sha256sum release/guard-signing-trust-v1.json | cut -d' ' -f1)"
          python3 scripts/ci/guard_market_clock.py \
            --check \
            --trusted-policy-sha256 \
              "$(sha256sum release/guard-market-trust-v1.json | cut -d' ' -f1)"
          python3 scripts/ci/passive_operations_scorecard.py --check
          python3 scripts/commercial/render_offers.py --check
          python3 scripts/ci/site_route_check.py
          python3 scripts/ci/site_metadata_truth_check.py
          python3 scripts/ci/runbook_currency_check.py
          python3 scripts/ci/site_deploy_check.py
          python3 -m pytest \
            scripts/ci/test_guard_launch_gate.py \
            scripts/ci/test_guard_market_clock.py \
            scripts/ci/test_guard_site_contract.py \
            scripts/ci/test_site_route_check.py \
            scripts/ci/test_site_deploy_check.py \
            scripts/ci/test_demand_report.py \
            scripts/ci/test_containment_health_audit.py \
            scripts/monitoring/test_guard_health_audit.py \
            scripts/deploy/test_static_site_canary.py \
            scripts/deploy/test_cloudflare_pages_release.py -q
          npm --prefix deploy/uptime-probe test
          node --check site/_worker.js
          node scripts/ci/site_worker_dispatch_test.mjs
          node scripts/ci/site_shared_checkout_test.mjs
          node --test scripts/ci/test_worker_estimate.mjs
          node scripts/ci/estimate_wasm_cli_parity_gate.mjs
          python3 scripts/ci/guard_pages_launch_preflight.py \
            --source-guard-trust-sha256 \
              "$(sha256sum release/guard-launch-trust-v1.json | cut -d' ' -f1)" \
            --source-signing-trust-sha256 \
              "$(sha256sum release/guard-signing-trust-v1.json | cut -d' ' -f1)" \
            --source-market-trust-sha256 \
              "$(sha256sum release/guard-market-trust-v1.json | cut -d' ' -f1)"

  preview:
    needs: static-contracts
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TINYZKP_SITE_PREVIEWS == 'enabled'
    runs-on: ubuntu-latest
    environment: tinyzkp-pages-preview
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Deploy isolated preview
        id: preview
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site
            --project-name tinyzkp
            --branch preview-pr-${{ github.event.number }}
            --commit-hash ${{ github.sha }}
            --commit-message "Guard preview ${{ github.sha }}"
      - name: Canary preview using static contracts and routes
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          python3 scripts/deploy/static_site_canary.py --base-url "$PREVIEW_URL" --mode contracts
          python3 scripts/deploy/static_site_canary.py --base-url "$PREVIEW_URL" --mode routes

  production:
    needs: static-contracts
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.TINYZKP_SITE_AUTODEPLOY == 'enabled'
    runs-on: ubuntu-latest
    environment: tinyzkp-production
    env:
      TINYZKP_GUARD_TRUST_POLICY_SHA256: ${{ vars.GUARD_LAUNCH_TRUST_POLICY_SHA256 }}
      TINYZKP_GUARD_MARKET_TRUST_POLICY_SHA256: ${{ vars.GUARD_MARKET_TRUST_POLICY_SHA256 }}
      TINYZKP_GUARD_SIGNING_TRUST_POLICY_SHA256: ${{ vars.GUARD_SIGNING_TRUST_POLICY_SHA256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - name: Anchor the installed Cosign executable
        run: |
          cosign_executable="$(command -v cosign)"
          test -x "$cosign_executable"
          echo "TINYZKP_COSIGN=$cosign_executable" >> "$GITHUB_ENV"
      - name: Install production preflight dependencies
        run: python3 -m pip install pytest
      - name: Validate independently anchored production evidence
        run: |
          # The validators require the protected values as soon as the
          # corresponding evidence or signing trust is configured. Empty
          # prelaunch policies deliberately permit the interim blocked site.
          candidate_state="$(jq -er .authorization_state \
            release/guard-candidate-build-authorization-v1.json)"
          commerce_state="$(jq -er .commerce_state \
            release/guard-launch-state-v2.json)"
          if test "$commerce_state" = public_live; then
            readiness=--require-ready
          elif test "$candidate_state" = candidate_prepared; then
            readiness=--require-promotion-ready
          elif test "$candidate_state" = authorized; then
            readiness=--require-candidate-build-ready
          elif jq -e \
            '[.gate_status[] | select(.status == "passed")] | length > 0' \
            release/guard-launch-state-v2.json >/dev/null; then
            readiness=--require-current-evaluation
          else
            readiness=
          fi
          python3 scripts/ci/guard_launch_gate.py --check ${readiness:+"$readiness"}
          python3 scripts/ci/guard_market_clock.py --check
          python3 scripts/ci/passive_operations_scorecard.py --check
      - name: Materialize reviewed ephemeral Node and Wrangler runtime
        run: |
          sudo install -d -m 0755 -o root -g root /var/lib/tinyzkp-runtime
          case "$GITHUB_SHA" in
            ""|*[!0-9a-f]*) echo "GITHUB_SHA is not lowercase hexadecimal" >&2; exit 1 ;;
          esac
          test "${#GITHUB_SHA}" -eq 40
          toolchain_source="/var/lib/tinyzkp-runtime/source-$GITHUB_SHA"
          if sudo test -e "$toolchain_source"; then
            echo "refusing existing toolchain source root: $toolchain_source" >&2
            exit 1
          fi
          sudo install -d -m 0700 -o root -g root "$toolchain_source"
          git archive --format=tar "$GITHUB_SHA" -- \
            scripts/ci/materialize_cloudflare_toolchain.py \
            scripts/ci/cloudflare_toolchain_check.py \
            release/cloudflare-production-toolchain-v1.json \
            toolchains/cloudflare/package.json \
            toolchains/cloudflare/package-lock.json | \
            sudo tar --extract --directory="$toolchain_source"
          if sudo find "$toolchain_source" -type l -print -quit | grep -q .; then
            echo "toolchain source archive contains a symbolic link" >&2
            exit 1
          fi
          test "$(sudo find "$toolchain_source" -type f | wc -l | tr -d ' ')" -eq 5
          for toolchain_input in \
            scripts/ci/materialize_cloudflare_toolchain.py \
            scripts/ci/cloudflare_toolchain_check.py \
            release/cloudflare-production-toolchain-v1.json \
            toolchains/cloudflare/package.json \
            toolchains/cloudflare/package-lock.json; do
            committed_sha256="$(git show "$GITHUB_SHA:$toolchain_input" | sha256sum | cut -d' ' -f1)"
            staged_sha256="$(sudo sha256sum "$toolchain_source/$toolchain_input" | cut -d' ' -f1)"
            if test "$staged_sha256" != "$committed_sha256"; then
              echo "staged toolchain input differs from commit: $toolchain_input" >&2
              exit 1
            fi
          done
          sudo chown -R root:root "$toolchain_source"
          sudo find "$toolchain_source" -type d -exec chmod 0700 {} +
          sudo find "$toolchain_source" -type f -exec chmod 0400 {} +
          sudo python3 \
            "$toolchain_source/scripts/ci/materialize_cloudflare_toolchain.py" \
            --download
      - name: Run protected production preflight and secret inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/ci/guard_pages_launch_preflight.py \
            --production \
            --node-executable \
              /var/lib/tinyzkp-runtime/node-v24.18.0-linux-x64/bin/node \
            --wrangler-entrypoint \
              /var/lib/tinyzkp-runtime/cloudflare-toolchain/node_modules/wrangler/bin/wrangler.js
      - name: Plan exact production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/tinyzkp-pages-release"
          python3 scripts/deploy/cloudflare_pages_release.py deploy \
            --release-sha "$GITHUB_SHA" \
            --expected-account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --plan-output "$RUNNER_TEMP/tinyzkp-pages-release/deploy-plan.json"
      - name: Apply exact plan with automatic deploy-failure rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TINYZKP_ALLOW_CLOUDFLARE_PAGES_WRITE: "1"
        run: |
          plan_sha="$(jq -er .plan_sha256 "$RUNNER_TEMP/tinyzkp-pages-release/deploy-plan.json")"
          python3 scripts/deploy/cloudflare_pages_release.py deploy \
            --release-sha "$GITHUB_SHA" \
            --expected-account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --apply \
            --expected-plan-sha256 "$plan_sha" \
            --record-output "$RUNNER_TEMP/tinyzkp-pages-release/deployment.json"
      - name: Report sanitized deploy failure classification
        if: failure()
        run: |
          failure_record="$RUNNER_TEMP/tinyzkp-pages-release/deployment.json.failure.json"
          test -f "$failure_record"
          jq -er '
            [
              "status=" + .status,
              "failure_stage=" + .failure_stage,
              "failure_type=" + .failure_type,
              "rollback_status=" + .rollback.status
            ] | .[]
          ' "$failure_record"
      - name: Run static canary with automatic exact rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TINYZKP_ALLOW_CLOUDFLARE_PAGES_WRITE: "1"
        run: |
          record_sha="$(sha256sum "$RUNNER_TEMP/tinyzkp-pages-release/deployment.json" | cut -d' ' -f1)"
          python3 scripts/deploy/cloudflare_pages_release.py canary \
            --deployment-record "$RUNNER_TEMP/tinyzkp-pages-release/deployment.json" \
            --expected-record-sha256 "$record_sha" \
            --expected-account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --output "$RUNNER_TEMP/tinyzkp-pages-release/canary.json"
      - name: Verify retired custom domains when decommission evidence is passed
        if: success()
        run: |
          if test "$(jq -r '.gate_status.hosted_infrastructure_decommissioned.status' release/guard-launch-state-v2.json)" = passed; then
            python3 scripts/deploy/static_site_canary.py --mode retired-hosts
          fi
