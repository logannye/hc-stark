name: Build signed TinyZKP engine candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-gate:
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an owner-dispatched immutable backend release tag
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$EXPECTED_OWNER" = logannye
          test "$ACTOR" = "$EXPECTED_OWNER"
          test "$TRIGGERING_ACTOR" = "$EXPECTED_OWNER"
          test "$RELEASE_REF_TYPE" = tag
          [[ "$RELEASE_TAG" =~ ^backend-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Bind the immutable tag to exact current protected main
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - run: python3 -m pip install -r scripts/benchmark/requirements.txt
      - name: Materialize the reviewed Git executable
        run: |
          python3 scripts/ci/materialize_anchored_git.py \
            --output "$RUNNER_TEMP/tinyzkp-anchored-git" \
            --github-env "$GITHUB_ENV"
      - name: Require every pre-signing backend-v1 gate
        run: python3 scripts/ci/backend_prerelease_ready.py

  signed-artifacts:
    needs: candidate-gate
    if: >-
      needs.candidate-gate.result == 'success' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: tinyzkp-engine-signing
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      HC_RELEASE_SHA: ${{ github.sha }}
      HC_RELEASE_REF: ${{ github.ref_name }}
      HC_RELEASE_BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Rebind privileged signing to owner and exact current main
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$EXPECTED_OWNER" = logannye
          test "$ACTOR" = "$EXPECTED_OWNER"
          test "$TRIGGERING_ACTOR" = "$EXPECTED_OWNER"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$HC_RELEASE_SHA"
          test "$(git rev-parse "$HC_RELEASE_REF^{commit}")" = "$HC_RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$HC_RELEASE_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - name: Install static Linux and OCI smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools skopeo
      - run: python3 -m pip install -r scripts/benchmark/requirements.txt
      - name: Materialize the reviewed Git executable
        run: |
          python3 scripts/ci/materialize_anchored_git.py \
            --output "$RUNNER_TEMP/tinyzkp-anchored-git" \
            --github-env "$GITHUB_ENV"
      - name: Recover an earlier exact staged candidate before building
        id: recovery
        run: |
          install -d release-artifacts
          artifact_name="engine-candidate-$HC_RELEASE_SHA"
          artifact_id="$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" |
            jq -r '[.artifacts[] | select(.expired == false)] |
              sort_by(.created_at) | last | .id // empty')"
          recovered=false
          if test -n "$artifact_id"; then
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > "$RUNNER_TEMP/engine-candidate.zip"
            unzip -q "$RUNNER_TEMP/engine-candidate.zip" -d release-artifacts
            recovered=true
          elif gh release view "$HC_RELEASE_REF" >/dev/null 2>&1; then
            target="$(gh release view "$HC_RELEASE_REF" --json targetCommitish --jq .targetCommitish)"
            test "$(git rev-parse "$target^{commit}")" = "$HC_RELEASE_SHA"
            test "$(gh release view "$HC_RELEASE_REF" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$HC_RELEASE_REF" --json isPrerelease --jq .isPrerelease)" = false
            gh release download "$HC_RELEASE_REF" --dir release-artifacts
            recovered=true
          fi
          if test "$recovered" = true; then
            test -f release-artifacts/SHA256SUMS
            test -f release-artifacts/SHA256SUMS.sigstore.json
            cosign verify-blob \
              --bundle release-artifacts/SHA256SUMS.sigstore.json \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-backend.yml@refs/tags/${HC_RELEASE_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "$HC_RELEASE_SHA" \
              --certificate-github-workflow-ref "refs/tags/$HC_RELEASE_REF" \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-trigger workflow_dispatch \
              release-artifacts/SHA256SUMS
            (
              cd release-artifacts
              sha256sum --check --strict SHA256SUMS
              expected_names="$(
                { awk '{sub(/^\\.\\//, \"\", $2); print $2}' SHA256SUMS
                  printf '%s\n' SHA256SUMS SHA256SUMS.sigstore.json \
                    backend-v1-final-evidence.json backend-v1-final-gates.json; } |
                  sort
              )"
              actual_names="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
              test "$actual_names" = "$expected_names"
            )
            python3 scripts/ci/verify_engine_candidate_inventory.py release-artifacts
            python3 scripts/ci/backend_release_ready.py \
              --config release-artifacts/backend-v1-final-gates.json
            verify_attestation() {
              gh attestation verify "$1" \
                --repo "$GITHUB_REPOSITORY" \
                --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-backend.yml@refs/tags/${HC_RELEASE_REF}" \
                --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-backend.yml" \
                --signer-digest "$HC_RELEASE_SHA" \
                --source-digest "$HC_RELEASE_SHA" \
                --source-ref "refs/tags/$HC_RELEASE_REF" \
                --deny-self-hosted-runners
            }
            verify_attestation release-artifacts/backend-v1-final-evidence.json
            verify_attestation release-artifacts/backend-v1-final-gates.json
            test "$(jq -er .release_sha release-artifacts/engine-release.json)" = "$HC_RELEASE_SHA"
            test "$(jq -er .release_ref release-artifacts/engine-release.json)" = "$HC_RELEASE_REF"
          fi
          echo "recovered=$recovered" >> "$GITHUB_OUTPUT"
      - name: Build locked public engine
        if: steps.recovery.outputs.recovered != 'true'
        run: >-
          cargo build --locked --release -p hc-cli --bin hc-cli
          --target x86_64-unknown-linux-musl
      - name: Assemble release payload
        if: steps.recovery.outputs.recovered != 'true'
        run: |
          install -d release-artifacts
          engine=target/x86_64-unknown-linux-musl/release/hc-cli
          if readelf --program-headers "$engine" | grep -Fq 'Requesting program interpreter'; then
            echo "release engine must not require a dynamic program interpreter" >&2
            exit 1
          fi
          if readelf --dynamic "$engine" 2>/dev/null | grep -Fq '(NEEDED)'; then
            echo "release engine must not require shared libraries" >&2
            exit 1
          fi
          install -m 0755 "$engine" release-artifacts/tinyzkp-engine-linux-x86_64
          cp release/plonky3-compatibility-v1.json release-artifacts/
          cp release/backend-v1-gates.json release-artifacts/
          env -u HC_RELEASE_SHA -u HC_RELEASE_REF -u HC_RELEASE_BUILD_URL \
            release-artifacts/tinyzkp-engine-linux-x86_64 release > release-artifacts/engine-release.json
          test "$(jq -r .release_sha release-artifacts/engine-release.json)" = "$HC_RELEASE_SHA"
          test "$(jq -r .release_ref release-artifacts/engine-release.json)" = "$HC_RELEASE_REF"
      - name: Build customer-operated engine OCI archive
        if: steps.recovery.outputs.recovered != 'true'
        run: |
          install -d "$RUNNER_TEMP/engine-image-context"
          install -m 0755 \
            release-artifacts/tinyzkp-engine-linux-x86_64 \
            "$RUNNER_TEMP/engine-image-context/tinyzkp-engine-linux-x86_64"
          cp Dockerfile.release-runtime "$RUNNER_TEMP/engine-image-context/Dockerfile"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg HC_RELEASE_SHA \
            --build-arg HC_RELEASE_REF \
            --build-arg HC_RELEASE_BUILD_URL \
            --output type=oci,dest=release-artifacts/tinyzkp-engine.oci.tar \
            "$RUNNER_TEMP/engine-image-context"
      - name: Bind engine CLI and OCI release identities
        if: steps.recovery.outputs.recovered != 'true'
        run: |
          python3 scripts/release/build_engine_identity_report.py \
            --release-sha "$HC_RELEASE_SHA" \
            --release-ref "$HC_RELEASE_REF" \
            --engine release-artifacts/tinyzkp-engine-linux-x86_64 \
            --engine-release release-artifacts/engine-release.json \
            --oci-archive release-artifacts/tinyzkp-engine.oci.tar \
            --compatibility-manifest release-artifacts/plonky3-compatibility-v1.json \
            --output release-artifacts/engine-identity.json
      - name: Execute and bind standalone and confined OCI runtime smoke
        if: steps.recovery.outputs.recovered != 'true'
        run: |
          python3 scripts/release/smoke_engine_release_artifacts.py \
            --release-sha "$HC_RELEASE_SHA" \
            --release-ref "$HC_RELEASE_REF" \
            --engine release-artifacts/tinyzkp-engine-linux-x86_64 \
            --engine-release release-artifacts/engine-release.json \
            --oci-archive release-artifacts/tinyzkp-engine.oci.tar \
            --output release-artifacts/engine-runtime-smoke.json
      - name: Generate SPDX SBOM
        if: steps.recovery.outputs.recovered != 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/tinyzkp-engine.spdx.json
      - name: Create checksums
        if: steps.recovery.outputs.recovered != 'true'
        working-directory: release-artifacts
        run: |
          checksum_tmp="$RUNNER_TEMP/engine-release-SHA256SUMS"
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            LC_ALL=C sort -z | xargs -0 sha256sum >"$checksum_tmp"
          mv "$checksum_tmp" SHA256SUMS
      - name: Keyless-sign the checksum manifest
        if: steps.recovery.outputs.recovered != 'true'
        working-directory: release-artifacts
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Verify signature and construct final release evidence
        if: steps.recovery.outputs.recovered != 'true'
        run: |
          python3 scripts/release/finalize_signed_evidence.py \
            --candidate-config release/backend-v1-gates.json \
            --release-sha "$HC_RELEASE_SHA" \
            --release-ref "$HC_RELEASE_REF" \
            --sbom release-artifacts/tinyzkp-engine.spdx.json \
            --checksums release-artifacts/SHA256SUMS \
            --signature release-artifacts/SHA256SUMS.sigstore.json \
            --identity-report release-artifacts/engine-identity.json \
            --runtime-smoke release-artifacts/engine-runtime-smoke.json \
            --output-evidence release-artifacts/backend-v1-final-evidence.json \
            --output-config release-artifacts/backend-v1-final-gates.json
          python3 scripts/ci/backend_release_ready.py \
            --config release-artifacts/backend-v1-final-gates.json
      - name: Attest released files
        if: steps.recovery.outputs.recovered != 'true'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-checksums: release-artifacts/SHA256SUMS
      - name: Attest final gate evidence
        if: steps.recovery.outputs.recovered != 'true'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: |
            release-artifacts/backend-v1-final-evidence.json
            release-artifacts/backend-v1-final-gates.json
      - name: Stage the exact signed candidate for retry-safe publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-candidate-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-draft:
    needs: signed-artifacts
    if: >-
      needs.signed-artifacts.result == 'success' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: tinyzkp-engine-signing
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Rebind privileged publication to owner and exact current main
        env:
          ACTOR: ${{ github.actor }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          test "$EXPECTED_OWNER" = logannye
          test "$ACTOR" = "$EXPECTED_OWNER"
          test "$TRIGGERING_ACTOR" = "$EXPECTED_OWNER"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
      - name: Recover the protected staged candidate
        run: |
          install -d "$RUNNER_TEMP/release-artifacts"
          gh run download "$GITHUB_RUN_ID" \
            --name "engine-candidate-$RELEASE_SHA" \
            --dir "$RUNNER_TEMP/release-artifacts"
          test -f "$RUNNER_TEMP/release-artifacts/SHA256SUMS"
          (
            cd "$RUNNER_TEMP/release-artifacts"
            sha256sum --check --strict SHA256SUMS
          )
          verify_attestation() {
            gh attestation verify "$1" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-backend.yml@refs/tags/${RELEASE_TAG}" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-backend.yml" \
              --signer-digest "$RELEASE_SHA" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners
          }
          verify_attestation "$RUNNER_TEMP/release-artifacts/backend-v1-final-evidence.json"
          verify_attestation "$RUNNER_TEMP/release-artifacts/backend-v1-final-gates.json"
      - name: Create or repair only the exact immutable draft
        run: |
          assets="$RUNNER_TEMP/release-artifacts"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
            test "$(git rev-parse "$target^{commit}")" = "$RELEASE_SHA"
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = false
          else
            gh release create "$RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --draft \
              --title "TinyZKP engine $RELEASE_TAG"
          fi
          install -d "$RUNNER_TEMP/remote-assets"
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            if gh release view "$RELEASE_TAG" --json assets \
              --jq '.assets[].name' | grep -Fxq "$name"
            then
              gh release download "$RELEASE_TAG" \
                --pattern "$name" \
                --dir "$RUNNER_TEMP/remote-assets"
              test "$(sha256sum "$file" | cut -d' ' -f1)" = \
                "$(sha256sum "$RUNNER_TEMP/remote-assets/$name" | cut -d' ' -f1)"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done < <(find "$assets" -maxdepth 1 -type f -print0 | sort -z)
          local_names="$(find "$assets" -maxdepth 1 -type f -printf '%f\n' | sort)"
          remote_names="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$remote_names" = "$local_names"
          rm -rf "$RUNNER_TEMP/remote-assets"
          install -d "$RUNNER_TEMP/remote-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/remote-assets"
          while IFS= read -r -d '' file; do
            name="${file##*/}"
            test "$(sha256sum "$file" | cut -d' ' -f1)" = \
              "$(sha256sum "$RUNNER_TEMP/remote-assets/$name" | cut -d' ' -f1)"
          done < <(find "$assets" -maxdepth 1 -type f -print0 | sort -z)
