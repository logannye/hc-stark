name: Release Plonky3 backend

on:
  push:
    tags:
      - "backend-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require an immutable backend release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          case "$RELEASE_TAG" in backend-v*) ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/benchmark/requirements.txt
      - name: Require every pre-signing backend-v1 gate
        run: python3 scripts/ci/backend_prerelease_ready.py

  signed-artifacts:
    needs: candidate-gate
    runs-on: ubuntu-latest
    env:
      HC_RELEASE_SHA: ${{ github.sha }}
      HC_RELEASE_REF: ${{ github.ref_name }}
      HC_RELEASE_BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m pip install -r scripts/benchmark/requirements.txt
      - name: Build locked production binaries
        run: cargo build --locked --release -p hc-cli -p hc-server -p hc-mcp --bins
      - name: Assemble release payload
        run: |
          install -d release-artifacts
          install -m 0755 target/release/hc-cli release-artifacts/hc-cli-linux-x86_64
          install -m 0755 target/release/hc-server release-artifacts/hc-server-linux-x86_64
          install -m 0755 target/release/hc-mcp-http release-artifacts/hc-mcp-http-linux-x86_64
          install -m 0755 target/release/hc-mcp-stdio release-artifacts/hc-mcp-stdio-linux-x86_64
          cp release/plonky3-compatibility-v1.json release-artifacts/
          cp release/backend-v1-gates.json release-artifacts/
          env -u HC_RELEASE_SHA -u HC_RELEASE_REF -u HC_RELEASE_BUILD_URL \
            release-artifacts/hc-cli-linux-x86_64 release > release-artifacts/cli-release.json
          test "$(jq -r .release_sha release-artifacts/cli-release.json)" = "$HC_RELEASE_SHA"
          test "$(jq -r .release_ref release-artifacts/cli-release.json)" = "$HC_RELEASE_REF"
      - name: Build maintenance OCI image archive
        run: |
          docker buildx build \
            --build-arg HC_RELEASE_SHA \
            --build-arg HC_RELEASE_REF \
            --build-arg HC_RELEASE_BUILD_URL \
            --output type=oci,dest=release-artifacts/tinyzkp-maintenance.oci.tar .
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/tinyzkp-backend.spdx.json
      - name: Create checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Keyless-sign the checksum manifest
        working-directory: release-artifacts
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Verify signature and construct final release evidence
        run: |
          python3 scripts/release/finalize_signed_evidence.py \
            --candidate-config release/backend-v1-gates.json \
            --release-sha "$HC_RELEASE_SHA" \
            --sbom release-artifacts/tinyzkp-backend.spdx.json \
            --checksums release-artifacts/SHA256SUMS \
            --signature release-artifacts/SHA256SUMS.sigstore.json \
            --output-evidence release-artifacts/backend-v1-final-evidence.json \
            --output-config release-artifacts/backend-v1-final-gates.json
          python3 scripts/ci/backend_release_ready.py \
            --config release-artifacts/backend-v1-final-gates.json
      - name: Attest released files
        uses: actions/attest@v4
        with:
          subject-checksums: release-artifacts/SHA256SUMS
      - name: Attest final gate evidence
        uses: actions/attest@v4
        with:
          subject-path: |
            release-artifacts/backend-v1-final-evidence.json
            release-artifacts/backend-v1-final-gates.json
      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/*
