name: Promote exact TinyZKP engine and Guard candidates

on:
  workflow_dispatch:
    inputs:
      engine_candidate_tag:
        description: Immutable backend-v* draft candidate tag
        required: true
        type: string
      guard_candidate_tag:
        description: Immutable guard-v* draft candidate tag
        required: true
        type: string
      expected_launch_source_sha256:
        description: Reviewed GuardLaunchEvidenceV2 canonical SHA-256
        required: true
        type: string

permissions:
  attestations: read
  contents: write
  packages: write
  id-token: none

concurrency:
  group: tinyzkp-joint-release-promotion
  cancel-in-progress: false

jobs:
  promote-without-rebuild:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: tinyzkp-release-promotion
    env:
      GH_TOKEN: ${{ github.token }}
      TRUST_POLICY_SHA256: ${{ vars.GUARD_LAUNCH_TRUST_POLICY_SHA256 }}
      SIGNING_TRUST_POLICY_SHA256: ${{ vars.GUARD_SIGNING_TRUST_POLICY_SHA256 }}
      ENGINE_TAG: ${{ inputs.engine_candidate_tag }}
      GUARD_TAG: ${{ inputs.guard_candidate_tag }}
      EXPECTED_OWNER: ${{ github.repository_owner }}
      DISPATCH_ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3

      - name: Validate independently anchored launch evidence and exact source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_launch_source_sha256 }}
        run: |
          test "$DISPATCH_ACTOR" = "$EXPECTED_OWNER"
          test "$TRIGGERING_ACTOR" = "$EXPECTED_OWNER"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          test -n "$TRUST_POLICY_SHA256"
          test -n "$SIGNING_TRUST_POLICY_SHA256"
          test "$(jq -er .source_sha256 release/guard-launch-state-v2.json)" = "$EXPECTED_SOURCE"
          python3 scripts/ci/guard_launch_gate.py \
            --check \
            --require-promotion-ready \
            --trusted-policy-sha256 "$TRUST_POLICY_SHA256" \
            --trusted-signing-policy-sha256 "$SIGNING_TRUST_POLICY_SHA256"
          test -z "$(git status --porcelain)"

      - name: Require two immutable candidates at the exact source identities
        run: |
          case "$ENGINE_TAG" in backend-v*) ;; *) exit 1 ;; esac
          case "$GUARD_TAG" in guard-v*) ;; *) exit 1 ;; esac
          test "$ENGINE_TAG" != "$GUARD_TAG"
          engine_state="$(gh release view "$ENGINE_TAG" --json isDraft,isPrerelease \
            --jq '[.isDraft,.isPrerelease] | @tsv')"
          guard_state="$(gh release view "$GUARD_TAG" --json isDraft,isPrerelease \
            --jq '[.isDraft,.isPrerelease] | @tsv')"
          # The engine candidate is an ordinary draft. Guard is intentionally
          # a draft prerelease until this evidence-gated promotion. A retry may
          # observe either candidate in the final public/non-prerelease state.
          case "$engine_state" in
            $'true\tfalse'|$'false\tfalse') ;;
            *) echo "engine candidate lifecycle differs: $engine_state" >&2; exit 1 ;;
          esac
          case "$guard_state" in
            $'true\ttrue'|$'false\tfalse') ;;
            *) echo "Guard candidate lifecycle differs: $guard_state" >&2; exit 1 ;;
          esac
          engine_sha="$(jq -er .release_identity.engine_source_sha release/guard-launch-state-v2.json)"
          test "$(git rev-parse "$ENGINE_TAG^{commit}")" = "$engine_sha"
          # The Guard tag belongs to the earlier candidate-authorization
          # commit, not this later promotion-evidence commit. Its exact target
          # is verified from the signed channel after download.

      - name: Download candidates without rebuilding
        run: |
          test ! -e "$GITHUB_WORKSPACE/release-artifacts"
          install -d "$GITHUB_WORKSPACE/release-artifacts" "$RUNNER_TEMP/guard-candidate"
          gh release download "$ENGINE_TAG" --dir "$GITHUB_WORKSPACE/release-artifacts"
          gh release download "$GUARD_TAG" --dir "$RUNNER_TEMP/guard-candidate"

      - name: Verify exact signed engine candidate
        working-directory: ${{ github.workspace }}/release-artifacts
        run: |
          engine_sha="$(jq -er .release_identity.engine_source_sha "$GITHUB_WORKSPACE/release/guard-launch-state-v2.json")"
          engine_ref="refs/tags/$ENGINE_TAG"
          engine_signer="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-backend.yml@${engine_ref}"
          python3 "$GITHUB_WORKSPACE/scripts/ci/verify_engine_candidate_inventory.py" .
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$engine_signer" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$engine_sha" \
            --certificate-github-workflow-ref "$engine_ref" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-trigger workflow_dispatch \
            SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/ci/backend_release_ready.py" \
            --config backend-v1-final-gates.json
          test "$(jq -er .release_sha engine-release.json)" = \
            "$engine_sha"
          test "$(jq -er .release_ref engine-release.json)" = "$ENGINE_TAG"
          test "$(jq -er '.gates.signed_release_sbom_and_checksums.metadata.release_ref' \
            backend-v1-final-evidence.json)" = "$ENGINE_TAG"
          verify_attestation() {
            gh attestation verify "$1" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$engine_signer" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --signer-digest "$engine_sha" \
              --source-digest "$engine_sha" \
              --source-ref "$engine_ref" \
              --deny-self-hosted-runners
          }
          verify_attestation backend-v1-final-evidence.json
          verify_attestation backend-v1-final-gates.json

      - name: Verify signed Guard package, channel, schemas, and OCI identity
        working-directory: ${{ runner.temp }}/guard-candidate
        run: |
          test -f SHA256SUMS
          test -f SHA256SUMS.sig
          test -f guard-channel-v1.json
          test -f guard-channel-v1.json.sig
          test -f guard-release-index-v1.json
          test -f guard-release-index-v1.json.sig
          test -f signing-public-key.pem
          cmp --silent \
            "$GITHUB_WORKSPACE/release/guard-signing-public-key.pem" \
            signing-public-key.pem
          cosign verify-blob \
            --key "$GITHUB_WORKSPACE/release/guard-signing-public-key.pem" \
            --signature SHA256SUMS.sig \
            SHA256SUMS
          cosign verify-blob \
            --key "$GITHUB_WORKSPACE/release/guard-signing-public-key.pem" \
            --signature guard-channel-v1.json.sig \
            guard-channel-v1.json
          cosign verify-blob \
            --key "$GITHUB_WORKSPACE/release/guard-signing-public-key.pem" \
            --signature guard-release-index-v1.json.sig \
            guard-release-index-v1.json
          sha256sum --check --strict SHA256SUMS
          public_candidate_authorization_commit="$(jq -er \
            '.public_candidate_authorization_commit | select(test("^[0-9a-f]{40}$"))' \
            guard-channel-v1.json)"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$GUARD_TAG^{commit}")" = \
            "$public_candidate_authorization_commit"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "$public_candidate_authorization_commit" "$GITHUB_SHA"
          build_authorization="$RUNNER_TEMP/guard-candidate-authorization-a.json"
          git -C "$GITHUB_WORKSPACE" show \
            "$public_candidate_authorization_commit:release/guard-candidate-build-authorization-v1.json" \
            > "$build_authorization"
          prior_identity="$(jq -r '.prior_qualified_release.release_identity // empty' \
            "$GITHUB_WORKSPACE/release/guard-candidate-build-authorization-v1.json")"
          prior_args=()
          if test -n "$prior_identity"; then
            prior_sha="$(jq -er '.prior_qualified_release.release_index_sha256' \
              "$GITHUB_WORKSPACE/release/guard-candidate-build-authorization-v1.json")"
            prior_channel_url="$(jq -er --arg identity "$prior_identity" \
              '.releases[] | select(.release_identity == $identity) | .channel_url' \
              guard-release-index-v1.json)"
            case "$prior_channel_url" in
              https://github.com/logannye/hc-stark/releases/download/guard-v*/guard-channel-v1.json) ;;
              *) echo "prior release-index URL is outside the public channel" >&2; exit 1 ;;
            esac
            prior_index_url="${prior_channel_url%/guard-channel-v1.json}/guard-release-index-v1.json"
            prior_index="$RUNNER_TEMP/prior-guard-release-index-v1.json"
            curl --fail --location --proto '=https' --tlsv1.2 \
              "$prior_index_url" --output "$prior_index"
            test "$(sha256sum "$prior_index" | cut -d' ' -f1)" = "$prior_sha"
            prior_args=(--prior-release-index "$prior_index")
          fi
          python3 "$GITHUB_WORKSPACE/scripts/ci/verify_guard_candidate.py" \
            --candidate-dir . \
            --launch-state "$GITHUB_WORKSPACE/release/guard-launch-state-v2.json" \
            --candidate-authorization "$GITHUB_WORKSPACE/release/guard-candidate-build-authorization-v1.json" \
            --build-authorization "$build_authorization" \
            --site-release "$GITHUB_WORKSPACE/site/release.json" \
            --schemas-dir "$GITHUB_WORKSPACE/site/schemas" \
            "${prior_args[@]}"

      - name: Verify the same reviewed prelaunch site identity is live
        run: |
          python3 scripts/deploy/static_site_canary.py \
            --base-url https://tinyzkp.com \
            --mode contracts

      - name: Install the OCI copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo

      - name: Publish the already-built OCI archives without rebuilding
        env:
          REGISTRY: ghcr.io
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          engine_digest="$(jq -er .release_binding.engine_oci_digest site/compatibility.json)"
          guard_digest="$(jq -er .oci_digest "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")"
          guard_version="$(jq -er .guard_version "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")"
          guard_archive="$(jq -er '[.artifacts[].name | select(endswith(".oci.tar"))] | if length == 1 then .[0] else error("one OCI archive required") end' \
            "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")"
          copy_exact_archive() {
            source_archive="$1"
            destination_tag="$2"
            expected_digest="$3"
            existing_manifest="$RUNNER_TEMP/existing-oci-manifest.json"
            inspect_error="$RUNNER_TEMP/existing-oci-inspect.err"
            if skopeo inspect \
              --authfile "$HOME/.docker/config.json" \
              --raw "docker://$destination_tag" \
              >"$existing_manifest" 2>"$inspect_error"
            then
              observed_digest="sha256:$(sha256sum "$existing_manifest" | cut -d' ' -f1)"
              if test "$observed_digest" != "$expected_digest"; then
                echo "refusing to overwrite immutable OCI tag $destination_tag" >&2
                return 1
              fi
              return 0
            else
              inspect_status="$?"
              if ! grep -Eiq 'manifest unknown|name unknown' "$inspect_error"; then
                cat "$inspect_error" >&2
                echo "refusing to publish after an indeterminate OCI tag lookup" >&2
                return "$inspect_status"
              fi
            fi
            skopeo copy --preserve-digests \
              --authfile "$HOME/.docker/config.json" \
              "oci-archive:$source_archive" \
              "docker://$destination_tag"
          }
          copy_exact_archive \
            "$GITHUB_WORKSPACE/release-artifacts/tinyzkp-engine.oci.tar" \
            "$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/tinyzkp-engine:${ENGINE_TAG}" \
            "$engine_digest"
          copy_exact_archive \
            "$RUNNER_TEMP/guard-candidate/$guard_archive" \
            "$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/tinyzkp-guard:$guard_version" \
            "$guard_digest"
          for image in \
            "$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/tinyzkp-engine@$engine_digest" \
            "$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/tinyzkp-guard@$guard_digest"
          do
            remote_digest="sha256:$(skopeo inspect \
              --authfile "$HOME/.docker/config.json" \
              --raw "docker://$image" | sha256sum | cut -d' ' -f1)"
            test "$remote_digest" = "${image##*@}"
            docker buildx imagetools inspect "$image" >/dev/null
          done
          skopeo inspect \
            --authfile "$HOME/.docker/config.json" \
            --config \
            "docker://$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/tinyzkp-guard@$guard_digest" |
            jq -e \
              --arg version "$guard_version" \
              --arg guard_sha "$(jq -er .guard_source_sha "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")" \
              --arg release_identity "$(jq -er .release_identity "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")" \
              --arg engine_sha "$(jq -er .engine_source_sha "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")" \
              --arg engine_artifact "$(jq -er .engine_artifact_sha256 "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")" \
              --arg profile "$(jq -er .compatibility_profile "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")" \
              '.config.Labels["org.opencontainers.image.source"] == "https://github.com/logannye/hc-stark"
               and .config.Labels["org.opencontainers.image.version"] == $version
               and .config.Labels["org.opencontainers.image.revision"] == $guard_sha
               and .config.Labels["org.opencontainers.image.tinyzkp.release-identity"] == $release_identity
               and .config.Labels["org.opencontainers.image.tinyzkp.engine-revision"] == $engine_sha
               and .config.Labels["org.opencontainers.image.tinyzkp.engine-artifact-sha256"] == $engine_artifact
               and .config.Labels["org.opencontainers.image.tinyzkp.profile"] == $profile' >/dev/null

          package_visibility() {
            package="$1"
            owner="$GITHUB_REPOSITORY_OWNER"
            gh api "/users/$owner/packages/container/$package" --jq .visibility \
              2>/dev/null ||
              gh api "/orgs/$owner/packages/container/$package" --jq .visibility
          }
          test "$(package_visibility tinyzkp-engine)" = public
          test "$(package_visibility tinyzkp-guard)" = public

          docker logout "$REGISTRY"
          for image in \
            "$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/tinyzkp-engine@$engine_digest" \
            "$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/tinyzkp-guard@$guard_digest"
          do
            anonymous_digest="sha256:$(skopeo inspect --no-creds \
              --raw "docker://$image" | sha256sum | cut -d' ' -f1)"
            test "$anonymous_digest" = "${image##*@}"
            skopeo inspect --no-creds --config "docker://$image" |
              jq -e \
                '.config.Labels["org.opencontainers.image.source"] ==
                 "https://github.com/logannye/hc-stark"' >/dev/null
          done

      - name: Publish only remaining GitHub drafts and require both public
        run: |
          publish_if_draft() {
            tag="$1"
            if test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true; then
              gh release edit "$tag" --draft=false --prerelease=false
            fi
          }
          publish_if_draft "$ENGINE_TAG"
          publish_if_draft "$GUARD_TAG"
          test "$(gh release view "$ENGINE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$GUARD_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$ENGINE_TAG" --json isPrerelease --jq .isPrerelease)" = false
          test "$(gh release view "$GUARD_TAG" --json isPrerelease --jq .isPrerelease)" = false

      - name: Replace candidate notes with exact GA artifact disclosures
        run: |
          guard_version="$(jq -er .guard_version "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")"
          release_identity="$(jq -er .release_identity "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")"
          profile="$(jq -er .compatibility_profile "$RUNNER_TEMP/guard-candidate/guard-channel-v1.json")"
          cat >"$RUNNER_TEMP/guard-ga-notes.md" <<EOF
          TinyZKP Guard ${guard_version}

          Signed release identity: ${release_identity}
          Compatibility profile: ${profile}

          Supported production proving is limited to Linux x86-64 and the exact published compatibility profile. Lookups, buses, AIR permutations, multi-table AIRs, preprocessed or periodic columns, custom fields, recursion profiles, GPUs, arbitrary Plonky3 forks, Windows, and macOS production proving remain unsupported.

          Guard executable and OCI assets are proprietary object code under the bundled EULA. Public hc-stark source and the Community engine remain MIT licensed.

          Checkout availability remains governed by the signed release and commerce manifests at tinyzkp.com.
          EOF
          gh release edit "$GUARD_TAG" \
            --title "TinyZKP Guard ${guard_version}" \
            --notes-file "$RUNNER_TEMP/guard-ga-notes.md"
          cat >"$RUNNER_TEMP/engine-ga-notes.md" <<EOF
          TinyZKP Community engine ${ENGINE_TAG}

          Source commit: $(jq -er .release_identity.engine_source_sha release/guard-launch-state-v2.json)
          Compatibility profile: ${profile}

          The public hc-stark source and Community engine are MIT licensed. Supported production claims remain limited to the exact published compatibility profile and evidence.
          EOF
          gh release edit "$ENGINE_TAG" \
            --title "TinyZKP Community engine ${ENGINE_TAG}" \
            --notes-file "$RUNNER_TEMP/engine-ga-notes.md"
          guard_notes="$(gh release view "$GUARD_TAG" --json body --jq .body)"
          grep -Fq "$release_identity" <<<"$guard_notes"
          grep -Fq "Compatibility profile: $profile" <<<"$guard_notes"
          grep -Fq "Linux x86-64" <<<"$guard_notes"
          grep -Fq "proprietary object code under the bundled EULA" <<<"$guard_notes"
          grep -Fq "Community engine remain MIT licensed" <<<"$guard_notes"
          if grep -Eiq '(^|[.!?][[:space:]]+)(checkout|sales)[[:space:]]+(is|are)[[:space:]]+live([.!?]|$)' <<<"$guard_notes"; then
            echo "Guard release notes overstate checkout availability" >&2
            exit 1
          fi
