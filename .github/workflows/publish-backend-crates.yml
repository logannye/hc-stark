name: Retired v1 crates.io publication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse irreversible crates.io publication
        run: |
          echo "TinyZKP v1 release promotion does not publish crates.io packages." >&2
          echo "Engine candidates remain draft artifacts until the joint Guard/site promotion gate exists." >&2
          exit 1
