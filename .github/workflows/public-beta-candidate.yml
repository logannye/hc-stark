name: Build paid public-beta candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged main commit to build
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: public-beta-candidate-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      HC_RELEASE_SHA: ${{ inputs.release_sha }}
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/hc-stark
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require exact current merged main candidate
        run: |
          [[ "$HC_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full lowercase Git commit" >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$HC_RELEASE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$HC_RELEASE_SHA"
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install candidate Python test dependencies
        run: |
          python3 -m pip install pytest -r billing/requirements.txt -r scripts/benchmark/requirements.txt
          python3 -m pip install build
      - name: Recheck candidate release gates
        run: |
          cargo test --locked -p hc-beta-api -p hc-beta-worker -p hc-cli
          cargo clippy --locked -p hc-beta-api -p hc-beta-worker -p hc-cli --all-targets -- -D warnings
          python3 scripts/ci/production_launch_preflight.py
      - name: Authenticate to immutable package registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - name: Build and push candidate images
        run: |
          install -d candidate-artifacts
          docker buildx build --push --provenance=true --sbom=true \
            --build-arg HC_RELEASE_SHA="$HC_RELEASE_SHA" \
            --file deploy/hetzner/beta/Dockerfile.api \
            --tag "$IMAGE_PREFIX/hc-beta-api:sha-$HC_RELEASE_SHA" \
            --metadata-file candidate-artifacts/api-metadata.json .
          docker buildx build --push --provenance=true --sbom=true \
            --build-arg HC_RELEASE_SHA="$HC_RELEASE_SHA" \
            --file deploy/hetzner/beta/Dockerfile.worker \
            --tag "$IMAGE_PREFIX/hc-beta-worker:sha-$HC_RELEASE_SHA" \
            --metadata-file candidate-artifacts/worker-metadata.json .
          docker buildx build --push --provenance=true --sbom=true \
            --build-arg HC_RELEASE_SHA="$HC_RELEASE_SHA" \
            --file deploy/hetzner/beta/Dockerfile.postgres \
            --tag "$IMAGE_PREFIX/tinyzkp-postgres:sha-$HC_RELEASE_SHA" \
            --metadata-file candidate-artifacts/postgres-metadata.json .
      - name: Record and sign immutable image identities
        run: |
          API_REF="$IMAGE_PREFIX/hc-beta-api@$(jq -er '."containerimage.digest"' candidate-artifacts/api-metadata.json)"
          WORKER_REF="$IMAGE_PREFIX/hc-beta-worker@$(jq -er '."containerimage.digest"' candidate-artifacts/worker-metadata.json)"
          POSTGRES_REF="$IMAGE_PREFIX/tinyzkp-postgres@$(jq -er '."containerimage.digest"' candidate-artifacts/postgres-metadata.json)"
          jq -n \
            --arg release_sha "$HC_RELEASE_SHA" \
            --arg api "$API_REF" \
            --arg worker "$WORKER_REF" \
            --arg postgres "$POSTGRES_REF" \
            '{schema_version:1,release_sha:$release_sha,images:{api:$api,worker:$worker,postgres:$postgres}}' \
            > candidate-artifacts/candidate-images.json
          {
            echo "API_REF=$API_REF"
            echo "WORKER_REF=$WORKER_REF"
            echo "POSTGRES_REF=$POSTGRES_REF"
          } >> "$GITHUB_ENV"
          cosign sign --yes "$API_REF"
          cosign sign --yes "$WORKER_REF"
          cosign sign --yes "$POSTGRES_REF"
      - name: Build standalone binaries and replacement SDK packages
        run: |
          docker buildx build \
            --build-arg HC_RELEASE_SHA="$HC_RELEASE_SHA" \
            --file deploy/hetzner/beta/Dockerfile.cli \
            --output "type=local,dest=$RUNNER_TEMP/hc-cli" .
          install -m 0755 "$RUNNER_TEMP/hc-cli/hc-cli-linux-x86_64" \
            candidate-artifacts/hc-cli-linux-x86_64
          CLI_RELEASE="$(docker run --rm --network none --read-only \
            --mount "type=bind,src=$PWD/candidate-artifacts/hc-cli-linux-x86_64,dst=/usr/local/bin/hc-cli,readonly" \
            debian:12.11-slim@sha256:b1a741487078b369e78119849663d7f1a5341ef2768798f7b7406c4240f86aef \
            /usr/local/bin/hc-cli release)"
          test "$(jq -er .release_sha <<<"$CLI_RELEASE")" = "$HC_RELEASE_SHA"

          api_container="$(docker create "$API_REF")"
          worker_container="$(docker create "$WORKER_REF")"
          cleanup() {
            docker rm -f "$api_container" "$worker_container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$api_container:/usr/local/bin/hc-beta-api" "$RUNNER_TEMP/hc-beta-api"
          docker cp "$worker_container:/usr/local/bin/hc-beta-worker" "$RUNNER_TEMP/hc-beta-worker"
          install -m 0755 "$RUNNER_TEMP/hc-beta-api" candidate-artifacts/hc-beta-api-linux-x86_64
          install -m 0755 "$RUNNER_TEMP/hc-beta-worker" candidate-artifacts/hc-beta-worker-linux-x86_64
          cleanup
          trap - EXIT

          install -d "$RUNNER_TEMP/python-sdk" "$RUNNER_TEMP/typescript-sdk"
          python3 -m build clients/python --outdir "$RUNNER_TEMP/python-sdk"
          install -m 0644 "$RUNNER_TEMP/python-sdk/tinyzkp-0.2.0.dev0-py3-none-any.whl" \
            candidate-artifacts/tinyzkp-0.2.0.dev0-py3-none-any.whl
          install -m 0644 "$RUNNER_TEMP/python-sdk/tinyzkp-0.2.0.dev0.tar.gz" \
            candidate-artifacts/tinyzkp-0.2.0.dev0.tar.gz

          npm --prefix clients/typescript ci
          (cd clients/typescript && npm pack --pack-destination "$RUNNER_TEMP/typescript-sdk")
          install -m 0644 "$RUNNER_TEMP/typescript-sdk/tinyzkp-0.2.0-dev.0.tgz" \
            candidate-artifacts/tinyzkp-0.2.0-dev.0.tgz

          git archive --format=tar.gz --prefix=tinyzkp-rust-sdk-0.2.0-dev.0/ \
            "$HC_RELEASE_SHA" Cargo.toml Cargo.lock clients/rust crates examples/partner-adapter test-vectors/plonky3 \
            > candidate-artifacts/tinyzkp-rust-sdk-0.2.0-dev.0.tar.gz
          install -d "$RUNNER_TEMP/rust-sdk"
          tar -xzf candidate-artifacts/tinyzkp-rust-sdk-0.2.0-dev.0.tar.gz \
            -C "$RUNNER_TEMP/rust-sdk"
          cargo test --manifest-path \
            "$RUNNER_TEMP/rust-sdk/tinyzkp-rust-sdk-0.2.0-dev.0/clients/rust/Cargo.toml" \
            --locked
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.API_REF }}
          format: spdx-json
          output-file: candidate-artifacts/hc-beta-api.spdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.WORKER_REF }}
          format: spdx-json
          output-file: candidate-artifacts/hc-beta-worker.spdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.POSTGRES_REF }}
          format: spdx-json
          output-file: candidate-artifacts/tinyzkp-postgres.spdx.json
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: candidate-artifacts/hc-beta-api-linux-x86_64
          format: spdx-json
          output-file: candidate-artifacts/hc-beta-api-linux-x86_64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: candidate-artifacts/hc-beta-worker-linux-x86_64
          format: spdx-json
          output-file: candidate-artifacts/hc-beta-worker-linux-x86_64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: candidate-artifacts/hc-cli-linux-x86_64
          format: spdx-json
          output-file: candidate-artifacts/hc-cli-linux-x86_64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: candidate-artifacts/tinyzkp-rust-sdk-0.2.0-dev.0.tar.gz
          format: spdx-json
          output-file: candidate-artifacts/tinyzkp-rust-sdk.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: candidate-artifacts/tinyzkp-0.2.0.dev0-py3-none-any.whl
          format: spdx-json
          output-file: candidate-artifacts/tinyzkp-python-sdk.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: candidate-artifacts/tinyzkp-0.2.0-dev.0.tgz
          format: spdx-json
          output-file: candidate-artifacts/tinyzkp-typescript-sdk.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Build and sign narrow live-billing canary authorization
        run: |
          python3 scripts/release/build_dark_canary_authorization.py \
            --release-sha "$HC_RELEASE_SHA" \
            --output candidate-artifacts/dark-canary-authorization.json
          cosign sign-blob --yes \
            --bundle candidate-artifacts/dark-canary-authorization.sigstore.json \
            candidate-artifacts/dark-canary-authorization.json
      - name: Sign complete candidate checksum inventory
        run: |
          checksum_inventory="$RUNNER_TEMP/SHA256SUMS"
          (cd candidate-artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > "$checksum_inventory"
          install -m 0644 "$checksum_inventory" candidate-artifacts/SHA256SUMS
          cosign sign-blob --yes --bundle candidate-artifacts/SHA256SUMS.sigstore.json candidate-artifacts/SHA256SUMS
      - uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-checksums: candidate-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-beta-candidate-${{ inputs.release_sha }}
          path: candidate-artifacts
          if-no-files-found: error
          retention-days: 30
