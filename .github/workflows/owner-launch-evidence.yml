name: Create owner-attested Guard launch evidence PR

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed lowercase 40-hex origin/main commit
        required: true
        type: string
      gate:
        description: One blocked owner-verifiable launch gate
        required: true
        type: choice
        options:
          - engine_release_ready
          - guard_release_ready
          - legal_terms_approved
          - merchant_sandbox_lifecycle_passed
          - merchant_live_owner_smoke_passed
          - legacy_obligations_resolved
          - hosted_infrastructure_decommissioned
          - release_rehearsal_within_budget
      claims_json:
        description: Strict gate-specific claims JSON; never include PII or secrets
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: tinyzkp-owner-launch-evidence-${{ inputs.gate }}
  cancel-in-progress: false

jobs:
  create-evidence-pr:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      GATE: ${{ inputs.gate }}
      CLAIMS_JSON: ${{ inputs.claims_json }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_OWNER: ${{ github.repository_owner }}
      DISPATCH_ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - name: Install pinned launch-test runtime
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Bind owner dispatch to exact current main
        run: |
          case "$EXPECTED_MAIN_SHA" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#EXPECTED_MAIN_SHA}" = 40
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$DISPATCH_ACTOR" = "$EXPECTED_OWNER"
          test "$TRIGGERING_ACTOR" = "$EXPECTED_OWNER"
          test -z "$(git status --porcelain)"
          cosign_executable="$(command -v cosign)"
          test -x "$cosign_executable"
          echo "TINYZKP_COSIGN=$cosign_executable" >> "$GITHUB_ENV"

      - name: Build the strict owner evidence envelope
        id: evidence
        run: |
          claims="$RUNNER_TEMP/owner-claims.json"
          printf '%s\n' "$CLAIMS_JSON" > "$claims"
          issued_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          evidence="release/evidence/guard-launch-v2/${GATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          bundle="${evidence%.json}.sigstore.json"
          python3 scripts/release/build_guard_owner_evidence.py build \
            --gate "$GATE" \
            --claims "$claims" \
            --issued-at "$issued_at" \
            --workflow-source-sha "$EXPECTED_MAIN_SHA" \
            --output "$evidence"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Keyless-sign the exact owner evidence envelope
        run: |
          cosign sign-blob --yes \
            --bundle "${{ steps.evidence.outputs.bundle }}" \
            "${{ steps.evidence.outputs.evidence }}"
          cosign verify-blob \
            --bundle "${{ steps.evidence.outputs.bundle }}" \
            --certificate-identity-regexp \
              '^https://github\.com/logannye/hc-stark/\.github/workflows/owner-launch-evidence\.yml@refs/heads/main$' \
            --certificate-oidc-issuer \
              'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "$EXPECTED_MAIN_SHA" \
            --certificate-github-workflow-ref 'refs/heads/main' \
            --certificate-github-workflow-repository 'logannye/hc-stark' \
            --certificate-github-workflow-trigger 'workflow_dispatch' \
            "${{ steps.evidence.outputs.evidence }}"

      - name: Attach one gate and regenerate every public contract
        run: |
          python3 scripts/release/build_guard_owner_evidence.py attach \
            --gate "$GATE" \
            --evidence "${{ steps.evidence.outputs.evidence }}" \
            --signature "${{ steps.evidence.outputs.bundle }}"
          launch_trust="$(sha256sum release/guard-launch-trust-v1.json | cut -d' ' -f1)"
          signing_trust="$(sha256sum release/guard-signing-trust-v1.json | cut -d' ' -f1)"
          python3 scripts/ci/guard_launch_gate.py \
            --write \
            --trusted-policy-sha256 "$launch_trust" \
            --trusted-signing-policy-sha256 "$signing_trust"
          python3 scripts/ci/guard_launch_gate.py \
            --check \
            --require-current-evaluation \
            --trusted-policy-sha256 "$launch_trust" \
            --trusted-signing-policy-sha256 "$signing_trust"
          python3 -m pytest \
            scripts/release/test_build_guard_owner_evidence.py \
            scripts/ci/test_guard_launch_gate.py -q
          node scripts/ci/site_shared_checkout_test.mjs

      - name: Commit and open the evidence-only pull request
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(release/|site/)' || true)"
          test -z "$unexpected"
          branch="codex/evidence/owner-${GATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release site
          git diff --cached --check
          git commit -m "Record owner evidence for ${GATE}"
          git push --set-upstream origin "$branch"
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          if pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Record owner evidence for ${GATE}" \
            --body "Owner-dispatched, keyless-signed evidence for \`${GATE}\`, bound to \`${EXPECTED_MAIN_SHA}\`. This PR does not bypass CI, merge itself, or claim any advisory review/adoption milestone." \
            2>"$RUNNER_TEMP/pr-create-error")"; then
            printf 'Evidence PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The evidence branch was pushed, but repository Actions settings prevented automatic PR creation. The owner must open the prepared compare URL."
            {
              printf '### Evidence branch prepared; owner action required\n\n'
              printf 'GitHub rejected automatic PR creation after the exact branch was pushed. '
              printf '[Open the owner-prepared PR](%s). No evidence needs to be rebuilt.\n' "$compare_url"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
