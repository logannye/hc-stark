name: Configure or freeze owner-controlled Guard launch

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact reviewed lowercase 40-hex origin/main commit
        required: true
        type: string
      operation:
        description: Strict forward configuration or emergency sales freeze
        required: true
        type: choice
        options:
          - configure
          - freeze-sales
      configuration_json:
        description: Strict GuardOwnerLaunchConfigurationV1 JSON; empty for freeze-sales
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: tinyzkp-owner-launch-configuration
  cancel-in-progress: false

jobs:
  configure-launch:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      OPERATION: ${{ inputs.operation }}
      CONFIGURATION_JSON: ${{ inputs.configuration_json }}
      EXPECTED_OWNER: ${{ github.repository_owner }}
      DISPATCH_ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
        with:
          cosign-release: v2.4.3
      - name: Install pinned launch-test runtime
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Bind owner dispatch to exact current main
        run: |
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$DISPATCH_ACTOR" = "$EXPECTED_OWNER"
          test "$TRIGGERING_ACTOR" = "$EXPECTED_OWNER"
          test -z "$(git status --porcelain)"
          cosign_executable="$(command -v cosign)"
          test -x "$cosign_executable"
          echo "TINYZKP_COSIGN=$cosign_executable" >> "$GITHUB_ENV"
      - name: Apply one strict owner operation
        run: |
          if test "$OPERATION" = configure; then
            test -n "$CONFIGURATION_JSON"
            configuration="$RUNNER_TEMP/guard-owner-configuration.json"
            printf '%s\n' "$CONFIGURATION_JSON" > "$configuration"
            python3 scripts/release/configure_guard_launch.py configure \
              --configuration "$configuration" \
              --issued-at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          else
            test "$OPERATION" = freeze-sales
            test -z "$CONFIGURATION_JSON"
            issued_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            evidence="release/evidence/guard-launch-v2/sales-freeze-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            bundle="${evidence%.json}.sigstore.json"
            python3 scripts/release/configure_guard_launch.py build-freeze \
              --issued-at "$issued_at" \
              --workflow-source-sha "$EXPECTED_MAIN_SHA" \
              --output "$evidence"
            cosign sign-blob --yes --bundle "$bundle" "$evidence"
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp '^https://github\.com/logannye/hc-stark/\.github/workflows/configure-guard-launch\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-sha "$EXPECTED_MAIN_SHA" \
              --certificate-github-workflow-ref refs/heads/main \
              --certificate-github-workflow-repository logannye/hc-stark \
              --certificate-github-workflow-trigger workflow_dispatch \
              "$evidence"
            python3 scripts/release/configure_guard_launch.py freeze-sales \
              --evidence "$evidence" \
              --signature "$bundle"
          fi
      - name: Regenerate and validate the complete launch contract
        run: |
          launch_trust="$(sha256sum release/guard-launch-trust-v1.json | cut -d' ' -f1)"
          signing_trust="$(sha256sum release/guard-signing-trust-v1.json | cut -d' ' -f1)"
          python3 scripts/ci/guard_launch_gate.py --write \
            --trusted-policy-sha256 "$launch_trust" \
            --trusted-signing-policy-sha256 "$signing_trust"
          python3 scripts/ci/guard_launch_gate.py --check \
            --trusted-policy-sha256 "$launch_trust" \
            --trusted-signing-policy-sha256 "$signing_trust"
          python3 -m pytest -q \
            scripts/release/test_configure_guard_launch.py \
            scripts/ci/test_guard_launch_gate.py
          node scripts/ci/site_shared_checkout_test.mjs
      - name: Open the owner configuration pull request
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(release/|site/)' || true)"
          test -z "$unexpected"
          branch="codex/guard-owner-${OPERATION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release site
          git diff --cached --check
          git commit -m "Apply owner Guard ${OPERATION}"
          git push --set-upstream origin "$branch"
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          if pr_url="$(gh pr create --base main --head "$branch" \
            --title "Apply owner Guard ${OPERATION}" \
            --body "Owner-dispatched strict Guard launch operation bound to \`${EXPECTED_MAIN_SHA}\`. Checkout remains derived and fail-closed; this workflow never merges the PR." \
            2>"$RUNNER_TEMP/pr-create-error")"; then
            printf 'Configuration PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The owner configuration branch was pushed, but repository Actions settings prevented automatic PR creation."
            printf '[Open the owner-prepared configuration PR](%s). No operation needs to be rerun.\n' \
              "$compare_url" >> "$GITHUB_STEP_SUMMARY"
          fi
