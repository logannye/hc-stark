name: TinyZKP
description: Invoke the free engine doctor or an activated Guard CLI through public JSON contracts.

inputs:
  operation:
    description: doctor, run, resume, or policy. Doctor is the free default.
    required: false
    default: doctor
  engine-binary:
    description: Path to the installed Community tinyzkp-engine executable.
    required: false
    default: tinyzkp-engine
  guard-binary:
    description: Path to an already activated TinyZKP Guard executable.
    required: false
    default: tinyzkp
  job:
    description: Relative JobManifestV1 path used by doctor or run.
    required: false
    default: tinyzkp-job-v1.json
  job-dir:
    description: Relative exact-release job directory used by resume.
    required: false
    default: ""
  report:
    description: Relative JobResultV1 path used by run, resume, or policy.
    required: false
    default: tinyzkp-job-result-v1.json
  baseline:
    description: Relative PolicyBaselineV1 path used by policy.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run TinyZKP local contracts
      shell: bash
      env:
        TINYZKP_ACTION_OPERATION: ${{ inputs.operation }}
        TINYZKP_ACTION_ENGINE: ${{ inputs.engine-binary }}
        TINYZKP_ACTION_GUARD: ${{ inputs.guard-binary }}
        TINYZKP_ACTION_JOB: ${{ inputs.job }}
        TINYZKP_ACTION_JOB_DIR: ${{ inputs.job-dir }}
        TINYZKP_ACTION_REPORT: ${{ inputs.report }}
        TINYZKP_ACTION_BASELINE: ${{ inputs.baseline }}
        TINYZKP_ACTION_PATH: ${{ github.action_path }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: '"${{ github.action_path }}/run.sh"'
