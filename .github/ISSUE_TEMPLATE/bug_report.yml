name: Supported-profile defect
description: Report a reproducible TinyZKP engine or Guard defect without sensitive data.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for the published compatibility profile. Do not attach witnesses, traces, proofs, checkpoints, scratch files, DoctorReportV1, license keys, entitlements, customer information, credentials, private paths, or proprietary AIR source.
  - type: input
    id: release
    attributes:
      label: Exact release identity
      description: Paste the complete release identity from `tinyzkp version --json` or `tinyzkp-engine release`; do not substitute only a branch name.
      placeholder: tinyzkp-guard/1.0.0+guard.<sha>.engine.<sha>.artifact.<sha256>
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Scrubbed compatibility result
      description: Include only the profile, platform, supported status, and reason codes.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal non-sensitive reproduction
      description: Use a synthetic or public workload. Never upload a real witness or private trace.
    validations:
      required: true
  - type: textarea
    id: verifier
    attributes:
      label: Official verifier result
      description: Include the boolean result and non-sensitive error class, if available.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Scrubbed diagnostics
      description: Optional. Include only a manually inspected SupportReportV1. Never attach DoctorReportV1; remove private paths, hostnames, license material, entitlements, witnesses, proofs, customer identifiers, environment variables, and secrets.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Data-safety confirmation
      options:
        - label: I confirmed this report contains no witness, trace, proof, checkpoint, scratch file, DoctorReportV1, license key, entitlement, credential, private path, customer data, or proprietary source.
          required: true
        - label: I reproduced this on the published supported profile.
          required: true
