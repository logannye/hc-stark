# cargo-audit configuration. It normally mirrors deny.toml, except for a
# documented inactive-feature false positive that cargo-deny correctly omits
# from its resolved feature graph.
#
# Shared advisory rationales live in deny.toml. Audit-only exceptions are
# documented inline below.
#
# Yanked registry releases are not ignored here. CI parses cargo-audit JSON and
# permits only the exact checksummed spin 0.9.8/0.10.0 compatibility bytes that
# lazy_static 1.5.0 and crc-fast 1.10.0 still require. Any other yanked package,
# vulnerability, or warning category remains release-blocking.

[advisories]
ignore = [
  "RUSTSEC-2026-0097",  # rand 0.10, transitive via postgres/rmcp paths
  "RUSTSEC-2026-0190",  # anyhow unsound warning; latest 1.0.102 still flagged
  "RUSTSEC-2025-0055",  # tracing-subscriber 0.2.25 via ark-relations 0.4
  "RUSTSEC-2024-0388",  # derivative unmaintained, via arkworks
  "RUSTSEC-2024-0436",  # paste unmaintained, via arkworks
  # sqlx 0.8's lockfile metadata lists its optional MySQL backend even though
  # hc-beta-api compiles only the PostgreSQL feature set. `cargo tree -i rsa`
  # is empty, so the vulnerable RSA code is not in any shipped binary.
  "RUSTSEC-2023-0071",
]
