<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="TinyZKP ChatGPT app receipt widget for verifying and minting transparent state-transition receipts through MCP.">
  <link rel="canonical" href="https://tinyzkp.com/apps/tinyzkp-receipt-widget">
  <title>TinyZKP Receipt Widget</title>
  <style>
    :root{color-scheme:light dark;--bg:#0e1116;--panel:#151a22;--text:#f4f7fb;--muted:#aeb8c7;--line:#2b3340;--accent:#38d39f;--warn:#ffd166}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;padding:18px;display:grid;gap:14px}
    header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}
    h1{font-size:18px;line-height:1.15;margin:0}
    .badge{border:1px solid rgba(56,211,159,.4);color:var(--accent);border-radius:999px;padding:4px 8px;font-size:12px;white-space:nowrap}
    section{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:14px;display:grid;gap:10px}
    h2{font-size:14px;margin:0}
    label{display:grid;gap:6px;color:var(--muted);font-size:12px}
    textarea,input{width:100%;border:1px solid var(--line);background:#0a0d12;color:var(--text);border-radius:6px;padding:10px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    textarea{min-height:112px;resize:vertical}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button,a.button{appearance:none;border:0;border-radius:6px;padding:10px 12px;background:var(--accent);color:#06110d;font-weight:700;text-decoration:none;text-align:center;cursor:pointer}
    button.secondary,a.secondary{background:#242b36;color:var(--text);border:1px solid var(--line)}
    .note{color:var(--warn);font-size:12px;margin:0}
    pre{margin:0;padding:12px;overflow:auto;border-radius:6px;background:#0a0d12;border:1px solid var(--line);min-height:56px}
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>TinyZKP receipts</h1>
      <p class="note">Default receipts are transparent. Do not put secrets, private customer data, or API keys into parameters.</p>
    </div>
    <span class="badge">MCP app prototype</span>
  </header>

  <section>
    <h2>Verify receipt</h2>
    <label>Proof JSON or base64 proof bytes
      <textarea id="proof-input" spellcheck="false"></textarea>
    </label>
    <button id="verify-btn" type="button">Verify</button>
  </section>

  <section>
    <h2>Mint accumulator receipt</h2>
    <div class="grid">
      <label>Initial
        <input id="initial" value="1000" inputmode="numeric">
      </label>
      <label>Final
        <input id="final" value="1045" inputmode="numeric">
      </label>
    </div>
    <label>Deltas
      <input id="deltas" value="10,20,15">
    </label>
    <button id="prove-btn" type="button">Create receipt</button>
    <a class="button secondary" href="https://tinyzkp.com/signup?source=openai_chatgpt_app&medium=chatgpt_app&platform=openai&intent=mcp_install" target="_blank" rel="noopener">Get API key</a>
  </section>

  <section>
    <h2>Result</h2>
    <pre id="result" aria-live="polite">{}</pre>
  </section>
</main>
<script>
(function(){
  var id = 1;
  var pending = {};
  var result = document.getElementById('result');

  function write(value){
    result.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
  }

  function callTool(name, argumentsValue){
    var requestId = id++;
    pending[requestId] = name;
    window.parent.postMessage({
      jsonrpc: '2.0',
      id: requestId,
      method: 'tools/call',
      params: { name: name, arguments: argumentsValue || {} }
    }, '*');
    write({status: 'sent', tool: name});
  }

  window.addEventListener('message', function(event){
    var message = event.data || {};
    if(message.method === 'ui/notifications/tool-result'){
      write(message.params || message);
      return;
    }
    if(message.id && pending[message.id]){
      delete pending[message.id];
      write(message.result || message.error || message);
    }
  });

  document.getElementById('verify-btn').addEventListener('click', function(){
    var proof = document.getElementById('proof-input').value.trim();
    if(!proof) return write({error: 'proof required'});
    callTool('verify_proof', {proof_b64: proof});
  });

  document.getElementById('prove-btn').addEventListener('click', function(){
    var initial = Number(document.getElementById('initial').value);
    var finalValue = Number(document.getElementById('final').value);
    var deltas = document.getElementById('deltas').value.split(',').map(function(part){return Number(part.trim());}).filter(Number.isFinite);
    if(!Number.isFinite(initial) || !Number.isFinite(finalValue) || !deltas.length){
      return write({error: 'valid initial, final, and deltas required'});
    }
    callTool('prove_template', {
      template_id: 'accumulator_step',
      parameters: {initial: initial, final: finalValue, deltas: deltas}
    });
  });
})();
</script>
</body>
</html>
