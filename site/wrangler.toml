name = "tinyzkp"
compatibility_date = "2025-12-01"
pages_build_output_dir = "."

# Shared by the anonymous rate limiter (Task 3, `rate_limit_windows`) and the
# shape-only demand log (Task 4, `demand_log`) -- see migrations/*.sql for
# both tables' schemas. `migrations_dir` points at the repo-root
# `migrations/` directory (one level up from this file) rather than a
# `site/migrations/` directory, matching this repo's existing convention of
# keeping migrations out of the deployed static-asset tree.
#
# `database_id` is the real `tinyzkp-estimator` D1 database, created by the
# account owner on 2026-07-28. Migrations in `../migrations` are applied with
# `wrangler d1 migrations apply DB --remote` from this directory.
#
# NOTE for anyone editing this block: a `database_id` that does not resolve in
# the Cloudflare account makes Wrangler REJECT THE DEPLOY outright -- it is not
# merely a runtime binding failure. A placeholder UUID here failed the
# production deploy on 2026-07-27 (auto-rolled back, no outage). The worker
# separately fails open when `env.DB` is missing at runtime (see
# site/_worker.js), but that safety net does not cover deploy-time rejection.
[[d1_databases]]
binding = "DB"
database_name = "tinyzkp-estimator"
database_id = "ea4ad71c-6175-4a69-b106-02cc4af378ae"
migrations_dir = "../migrations"
