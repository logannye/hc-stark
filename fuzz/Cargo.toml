[package]
name = "hc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
blake3 = "=1.8.2"
serde_json = "1.0"
tempfile = "3"

hc-sdk = { path = "../crates/hc-sdk" }
hc-verifier = { path = "../crates/hc-verifier" }
hc-core = { path = "../crates/hc-core" }
hc-commit = { path = "../crates/hc-commit" }
hc-hash = { path = "../crates/hc-hash" }
hc-plonky3 = { path = "../crates/hc-plonky3" }
hc-stream = { path = "../crates/hc-stream" }

