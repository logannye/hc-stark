name = "tinyzkp-uptime-probe"
main = "worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["global_fetch_strictly_public"]

# Probe every 5 minutes and exercise durable intake once per hour (cron is UTC).
[triggers]
crons = ["*/5 * * * *", "17 * * * *"]

[vars]
AUDIT_MODE = "containment"

# Set a non-email incident webhook, its bearer token, and the intake cleanup
# secret with `wrangler secret put`:
#   wrangler secret put ALERT_WEBHOOK_URL
#   wrangler secret put ALERT_WEBHOOK_TOKEN
#   wrangler secret put CONTACT_READINESS_SECRET
