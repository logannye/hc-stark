listen_addresses = '*'
port = 5432
max_connections = 40
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 256MB
statement_timeout = '10s'
lock_timeout = '3s'
idle_in_transaction_session_timeout = '30s'
log_min_duration_statement = 500
log_connections = on
log_disconnections = on
password_encryption = 'scram-sha-256'
ssl = off
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=tinyzkp-beta archive-push %p'
archive_timeout = '60s'
max_wal_senders = 3
wal_compression = on

