# Production maintenance overrides. No prover worker, billing cron, database,
# or on-host observability stack is deployed during backend recovery.
services:
  hc-server:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  hc-mcp:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
