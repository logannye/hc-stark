global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "hc-beta-api"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/beta_metrics_token
    static_configs:
      - targets: ["beta-api:9091"]
