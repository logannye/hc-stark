global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "hc-server"
    metrics_path: /metrics
    # HC_METRICS_TOKEN must match the value configured on hc-server.
    # Prometheus does not interpolate env vars in this file directly; set the
    # token value here or use credentials_file pointing to a file that
    # contains only the raw token string.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["hc-server:8080"]
