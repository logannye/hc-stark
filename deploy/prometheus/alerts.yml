groups:
  - name: tinyzkp-public-beta
    rules:
      - alert: TinyZKPBetaWritesContained
        expr: min(tinyzkp_beta_operational_flag) == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP beta new-obligation writes are contained" }
      - alert: TinyZKPBetaLedgerDifference
        expr: tinyzkp_beta_ledger_difference_accounts > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP immutable ledger differs from materialized balances" }
      - alert: TinyZKPBetaVerifierRejection
        expr: tinyzkp_beta_verifier_outcomes{outcome="rejected"} > 0
        for: 0m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP official verifier rejection recorded" }
      - alert: TinyZKPBetaWorkerStale
        expr: tinyzkp_beta_worker_heartbeat_age_seconds > 120
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP proving worker heartbeat is stale" }
      - alert: TinyZKPBetaStripeBacklog
        expr: tinyzkp_beta_stripe_event_backlog > 0
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP Stripe event backlog remains unprocessed" }
      - alert: TinyZKPBetaReconciliationStale
        expr: tinyzkp_beta_reconciliation_clean != 1 or tinyzkp_beta_reconciliation_age_seconds > 93600
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP billing reconciliation is stale or unclean" }
      - alert: TinyZKPBetaStorageLow
        expr: min(tinyzkp_beta_storage_free_percent) < 30
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP API or worker storage is below 30% free" }
      - alert: TinyZKPBetaBackupStale
        expr: tinyzkp_beta_backup_healthy != 1
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "TinyZKP backup/WAL health is stale" }
      - alert: TinyZKPBetaRetentionFailure
        expr: tinyzkp_beta_retention_failures > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "TinyZKP artifact retention deletion failed" }
      - alert: TinyZKPBetaControlPlaneSlow
        expr: histogram_quantile(0.95, rate(tinyzkp_beta_http_request_duration_seconds_bucket[10m])) > 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "TinyZKP beta API p95 latency exceeds one second" }
