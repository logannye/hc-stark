 [workspace]
 members = [
     "crates/hc-air",
     "crates/hc-bench",
     "crates/hc-cli",
     "crates/hc-commit",
     "crates/hc-core",
     "crates/hc-examples",
    "crates/hc-fri",
    "crates/hc-hash",
    "crates/hc-height",
    "crates/hc-plonky3",
    "crates/hc-stream",
    "crates/tinyzkp-contracts",
     "crates/hc-prover",
     "crates/hc-recursion",
     "crates/hc-replay",
     "crates/hc-simd",
     "crates/hc-verifier",
     "crates/hc-vm",
    "crates/hc-sdk",
    "crates/hc-wasm",
    "crates/hc-workloads",
    "crates/hc-rollup",
    "crates/hc-zkml",
    "crates/hc-zkvm",
    "crates/hc-sumcheck",
    "crates/hc-sumcheck-spartan",
    "crates/hc-ipa",
    "examples/partner-adapter",
 ]
 exclude = [
    "crates/hc-python",
    "crates/hc-node",
    "clients/rust",
    "fuzz",
 ]
 resolver = "2"

 [workspace.package]
 edition = "2021"
 license = "MIT"
 rust-version = "1.95"
 version = "0.1.0"

 [workspace.dependencies]
 thiserror = "1.0"
rand = { version = "0.8", features = ["std"] }
blake3 = "1.5"
sha2 = "0.10"
p3-air = "=0.6.1"
p3-challenger = "=0.6.1"
p3-commit = "=0.6.1"
p3-dft = "=0.6.1"
p3-field = "=0.6.1"
p3-fri = "=0.6.1"
p3-goldilocks = "=0.6.1"
p3-baby-bear = "=0.6.1"
p3-matrix = "=0.6.1"
p3-merkle-tree = "=0.6.1"
p3-poseidon2-air = "=0.6.1"
p3-symmetric = "=0.6.1"
p3-uni-stark = "=0.6.1"
