services:
  hc-server:
    image: tinyzkp/hc-server:${HC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - RUST_LOG=info
      - HC_RELEASE_SHA=${HC_RELEASE_SHA:-}
      - HC_RELEASE_REF=${HC_RELEASE_REF:-}
      - HC_RELEASE_BUILD_URL=${HC_RELEASE_BUILD_URL:-}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 30s

  hc-mcp:
    image: tinyzkp/hc-mcp:${HC_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/hc-mcp-http"]
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - RUST_LOG=info
      - HC_RELEASE_SHA=${HC_RELEASE_SHA:-}
      - HC_RELEASE_REF=${HC_RELEASE_REF:-}
      - HC_RELEASE_BUILD_URL=${HC_RELEASE_BUILD_URL:-}
      - HC_MCP_HTTP_HOST=0.0.0.0
      - HC_MCP_HTTP_PORT=3001
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 30s
