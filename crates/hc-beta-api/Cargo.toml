[package]
name = "hc-beta-api"
default-run = "hc-beta-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
async-trait = "0.1"
aws-config = { version = "1.9", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.138", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
blake3.workspace = true
bytes = "1.7"
hc-plonky3 = { path = "../hc-plonky3" }
hc-stream = { path = "../hc-stream" }
hex = "0.4"
hmac = "0.12"
http = "1.1"
libc = "0.2"
prometheus = "0.14"
rand.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "=1.2.1", features = ["uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
subtle = "2.6"
thiserror.workspace = true
tokio = { version = "1.41", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "fs"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
tower = "0.5"
