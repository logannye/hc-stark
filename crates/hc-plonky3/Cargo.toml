[package]
name = "hc-plonky3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Resource-bounded backend that emits official Plonky3 0.6.1 proofs"
repository = "https://github.com/logannye/hc-stark"
homepage = "https://tinyzkp.com"
documentation = "https://docs.rs/hc-plonky3"
readme = "README.md"

[features]
default = []
fault-injection = []

[dependencies]
blake3.workspace = true
base64 = "=0.22.1"
hc-stream = { version = "0.1.0", path = "../hc-stream" }
p3-air.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-fri.workspace = true
p3-baby-bear.workspace = true
p3-goldilocks.workspace = true
p3-matrix.workspace = true
p3-merkle-tree.workspace = true
p3-poseidon2-air.workspace = true
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
rand = "=0.10.2"
rayon = "=1.11.0"
schemars = "=1.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror.workspace = true
tinyzkp-contracts = { path = "../tinyzkp-contracts" }

[dev-dependencies]
tempfile = "3"

# zstd is a C dependency whose build script compiles an x86-64 assembly file
# (huf_decompress_amd64.S) even when targeting wasm32, which Apple clang
# rejects -- so its mere presence made `hc-wasm` unbuildable for
# wasm32-unknown-unknown. It is only used by the uploaded-trace path in
# declarative.rs, which reads chunk FILES and is therefore unreachable on a
# target with no filesystem. Scoped to non-wasm targets so the WASM estimator
# can be built and re-vendored; see declarative.rs's `compression` shim.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"
