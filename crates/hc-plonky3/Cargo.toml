[package]
name = "hc-plonky3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Resource-bounded backend that emits official Plonky3 0.6.1 proofs"
repository = "https://github.com/logannye/hc-stark"
homepage = "https://tinyzkp.com"
documentation = "https://docs.rs/hc-plonky3"
readme = "README.md"

[features]
default = []
fault-injection = []

[dependencies]
blake3.workspace = true
base64 = "=0.22.1"
hc-stream = { version = "0.1.0", path = "../hc-stream" }
p3-air.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-field.workspace = true
p3-fri.workspace = true
p3-goldilocks.workspace = true
p3-matrix.workspace = true
p3-merkle-tree.workspace = true
p3-poseidon2-air.workspace = true
p3-symmetric.workspace = true
p3-uni-stark.workspace = true
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
rand = "=0.10.2"
rayon = "=1.11.0"
schemars = "=1.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror.workspace = true
tinyzkp-contracts = { path = "../tinyzkp-contracts" }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
