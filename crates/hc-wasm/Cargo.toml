[package]
name = "hc-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local WASM verifier for official Plonky3 ProofBundleV1 artifacts"
repository = "https://github.com/logannye/hc-stark"
homepage = "https://tinyzkp.com"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hc-plonky3 = { path = "../hc-plonky3" }
tinyzkp-contracts = { path = "../tinyzkp-contracts" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand 0.10` (used by the frozen Plonky3 workload code) resolves to
# getrandom 0.4. Enable its explicit browser/JS backend for the local verifier.
getrandom_04 = { package = "getrandom", version = "=0.4.2", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
