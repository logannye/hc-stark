[package]
name = "hc-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false

[features]
default = []
legacy-research = [
  "dep:hc-core",
  "dep:hc-prover",
  "dep:hc-recursion",
  "dep:hc-sdk",
  "dep:hc-verifier",
  "dep:hc-vm",
  "dep:hc-workloads",
]

[lib]
path = "src/maintenance.rs"

[[bin]]
name = "hc-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["macros", "net", "rt-multi-thread", "signal"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hc-sdk = { path = "../hc-sdk", optional = true }
hc-workloads = { path = "../hc-workloads", optional = true }
hc-core = { path = "../hc-core", optional = true }
hc-prover = { path = "../hc-prover", optional = true }
hc-verifier = { path = "../hc-verifier", optional = true }
hc-recursion = { path = "../hc-recursion", optional = true }
hc-vm = { path = "../hc-vm", optional = true }

[dev-dependencies]
tower = "0.5"
tempfile = "3.10"
