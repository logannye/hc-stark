[package]
name = "hc-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
legacy-research = ["dep:hc-sdk", "dep:hc-workloads", "dep:hc-vm", "dep:hc-air", "dep:hc-core", "dep:hc-prover", "dep:hc-verifier"]

[dependencies]
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.0"
hc-sdk = { path = "../hc-sdk", optional = true }
hc-workloads = { path = "../hc-workloads", optional = true }
hc-vm = { path = "../hc-vm", optional = true }
hc-air = { path = "../hc-air", optional = true }
hc-core = { path = "../hc-core", optional = true }
hc-prover = { path = "../hc-prover", optional = true }
hc-verifier = { path = "../hc-verifier", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "hc-mcp-stdio"
path = "src/bin/hc-mcp-stdio.rs"

[[bin]]
name = "hc-mcp-http"
path = "src/bin/hc-mcp-http.rs"
