 [package]
 name = "hc-cli"
 version.workspace = true
 edition.workspace = true
 rust-version.workspace = true
 license.workspace = true
 publish = false

[features]
default = []
legacy-research = [
  "dep:ark-bn254",
  "dep:ark-serialize",
  "dep:hc-bench",
  "dep:hc-commit",
  "dep:hc-core",
  "dep:hc-fri",
  "dep:hc-hash",
  "dep:hc-prover",
  "dep:hc-recursion",
  "dep:hc-sdk",
  "dep:hc-verifier",
  "dep:hc-vm",
  "dep:hex",
  "dep:toml",
]

 [dependencies]
anyhow = "1.0"
blake3.workspace = true
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
hc-plonky3 = { path = "../hc-plonky3" }
hc-stream = { path = "../hc-stream" }
hc-commit = { path = "../hc-commit", optional = true }
hc-core = { path = "../hc-core", optional = true }
hc-bench = { path = "../hc-bench", optional = true }
hc-fri = { path = "../hc-fri", optional = true }
hc-hash = { path = "../hc-hash", optional = true }
hc-recursion = { path = "../hc-recursion", optional = true }
hc-prover = { path = "../hc-prover", optional = true }
hc-verifier = { path = "../hc-verifier", optional = true }
hc-vm = { path = "../hc-vm", optional = true }
hc-sdk = { path = "../hc-sdk", optional = true }
ark-bn254 = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
hex = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", optional = true }
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
